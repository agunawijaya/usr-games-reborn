name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, unit and Hall end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Lint, typecheck, unit tests, catalog, zero-raster, network, words, Mermaid.
      # The provenance scan skips itself here: the BSD originals never enter the repo.
      - name: Check
        run: pnpm check

      - name: README games table is current
        run: pnpm run docs:readme --check

      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Hall end-to-end tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/hall/playwright-report/
          retention-days: 7
