     * per glide keeps that feel and makes a seeded flight repeatable.
     */
    function drawPatience() {
      if (game.bare) return rules.ravenous(game.divesSinceBare).patienceMs + rand() * 200;
      // The more the snake carries, the less the bird waits (src/carry.mjs).
      return (tune.patience + rand() * tune.patienceSpread) * rules.carry(game.score).patience * game.birdHunger;
    }

    function updateEagle(dt) {
      // On the desk the bird keeps circling, but never locks on.
      if (game.state !== 'playing' && game.state !== 'menu') return;
      eagle.stateTime += dt;
      const dtSec = dt / 1000;
      // Gliding, the bird looks round for the nearest snake every second; it settles on one
      // when it locks on.
      if (eagle.state === 'glide') {
        eagle.lookAgainIn -= dt;
        if (eagle.lookAgainIn <= 0) {
          eagle.quarry = nearestQuarry();
          eagle.lookAgainIn = 1000;
        }
      }
      const { x: px, y: py } = quarryHead();

      switch (eagle.state) {
        case 'glide': {
          const ang = Math.atan2(py - eagle.y, px - eagle.x);
          const circleAng = ang + Math.PI * 0.42;
          const tgtVx = Math.cos(circleAng) * tune.glideSpeed;
          const tgtVy = Math.sin(circleAng) * tune.glideSpeed;
          eagle.vx += (tgtVx - eagle.vx) * Math.min(1, 0.0022 * dt);
          eagle.vy += (tgtVy - eagle.vy) * Math.min(1, 0.0022 * dt);
          eagle.x += eagle.vx * dtSec;
          eagle.y += eagle.vy * dtSec;
          eagle.altitude = 0.72 + 0.06 * Math.sin(eagle.wingPhase * 0.5);
          eagle.wingPhase += dt * 0.0035;
          if (game.state === 'playing' && !game.birdAsleep && eagle.stateTime > eagle.patience
            && (nearestQuarry() || !game.leaving)) {
            eagle.state = 'lock';
            eagle.stateTime = 0;
            eagle.quarry = nearestQuarry();
            eagle.lockMs = tune.lockMs * (game.bare
              ? rules.ravenous(game.divesSinceBare).lock
              : rules.carry(game.score).lock);
            emit({ type: 'lock', quarry: quarryKind() });
          }
          break;
        }
        case 'lock': {
          // The ring follows the head while the bird takes aim; the dive goes where it ends.
          eagle.targetX = px;
          eagle.targetY = py;
          eagle.vx *= Math.pow(0.4, dtSec * 3);
          eagle.vy *= Math.pow(0.4, dtSec * 3);
          eagle.x += eagle.vx * dtSec;
          eagle.y += eagle.vy * dtSec;
          eagle.altitude -= 0.00018 * dt;
          eagle.wingPhase += dt * 0.006;
          if (eagle.stateTime > eagle.lockMs) {
            eagle.state = 'dive';
            eagle.stateTime = 0;
            eagle.targetX = px;
            eagle.targetY = py;
            eagle.fromX = eagle.x;
            eagle.fromY = eagle.y;
            eagle.fromAltitude = eagle.altitude;
            // A dive is long enough for a snake keeping straight on to be clear of it; once the
            // field is bare that holds for a few dives more, then each comes quicker
            // (src/carry.mjs).
            eagle.diveMs = tune.diveMs * rules.carry(game.score).dive * game.diveQuickening
              * (game.bare ? rules.ravenous(game.divesSinceBare++).dive : 1);
            emit({ type: 'dive', quarry: quarryKind() });
          }
          break;
        }
        case 'dive': {
          // The dive takes the same time from wherever it starts, so the warning always means
          // the same: keep moving, and the talons come down where you were.
          const t = Math.min(1, eagle.stateTime / eagle.diveMs);
          const fall = t * t;
          const nx = eagle.fromX + (eagle.targetX - eagle.fromX) * fall;
          const ny = eagle.fromY + (eagle.targetY - eagle.fromY) * fall;
          if (dtSec > 0) {
            eagle.vx = (nx - eagle.x) / dtSec;
            eagle.vy = (ny - eagle.y) / dtSec;
          }
          eagle.x = nx;
          eagle.y = ny;
          eagle.altitude = eagle.fromAltitude + (0.05 - eagle.fromAltitude) * fall;
          eagle.wingPhase += dt * 0.020;
          if (t >= 1) {
            eagle.state = 'strike';
            eagle.stateTime = 0;
            eagle.altitude = 0.02;
            spawnStrike(eagle.x, eagle.y);
          }
          break;
        }
        case 'strike': {
          eagle.altitude = 0.02;
          if (eagle.stateTime > 260) {
            eagle.state = 'climb';
            eagle.stateTime = 0;
            // A dodge is the player's only when the dive was meant for the player.
            if (game.state === 'playing' && !eagle.quarry) emit({ type: 'dodged' });
            const angleAway = Math.atan2(eagle.y - py, eagle.x - px);
            eagle.vx = Math.cos(angleAway) * 160;
            eagle.vy = Math.sin(angleAway) * 160 - 120;
          }
          break;
        }
        case 'climb': {
          eagle.altitude += 0.0013 * dt;
          eagle.x += eagle.vx * dtSec;
          eagle.y += eagle.vy * dtSec;
          eagle.vy += 55 * dtSec;
          eagle.wingPhase += dt * 0.014;
          if (eagle.altitude > 0.75) {
            eagle.state = 'glide';
            eagle.stateTime = 0;
            eagle.patience = drawPatience();
          }
          break;
        }
      }

      if (eagle.x < -80)    eagle.x = W + 80;
      if (eagle.x > W + 80) eagle.x = -80;
      if (eagle.y < 40)     eagle.y = 40;
      if (eagle.y > H - 40) eagle.y = H - 40;

      stateLabel.textContent = game.bare && game.state === 'playing' && eagle.state === 'glide'
        ? 'RAVENOUS'
        : eagle.state.toUpperCase();
    }

    function renderEagle(time) {
      // Shadow on ground plane
      const shadowScale = 0.4 + eagle.altitude * 1.2;
      const shadowAlpha = 0.15 + (1 - eagle.altitude) * 0.6;
      const grad = ctx.createRadialGradient(eagle.x, eagle.y, 0, eagle.x, eagle.y, 32 * shadowScale);
      grad.addColorStop(0,   `rgba(0,0,0,${shadowAlpha})`);
      grad.addColorStop(0.6, `rgba(0,0,0,${shadowAlpha * 0.35})`);
      grad.addColorStop(1,   `rgba(0,0,0,0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(eagle.x, eagle.y, 32 * shadowScale, 16 * shadowScale, 0, 0, Math.PI * 2);
      ctx.fill();

      // Lock-on warning ring
      if (eagle.state === 'lock' || eagle.state === 'dive') {
        const t = Math.min(1, eagle.stateTime / (eagle.state === 'lock' ? eagle.lockMs : eagle.diveMs));
        const r = 40 * (1 - t * 0.6);
        ctx.strokeStyle = `rgba(255,80,80,${0.55 * (1 - t * 0.5)})`;
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.arc(eagle.targetX || eagle.x, eagle.targetY || eagle.y, r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      const drawY = eagle.y - eagle.altitude * 75;
      const scale = 0.85 + (1 - eagle.altitude) * 0.6;
      const heading = Math.atan2(eagle.vy, eagle.vx);

      let wingFactor, wingSweep;
      if (eagle.state === 'dive') {
        wingFactor = 0.6;  wingSweep = -0.35;
      } else if (eagle.state === 'strike') {
        wingFactor = 0.8;  wingSweep = 0.4;
      } else {
        wingFactor = Math.sin(eagle.wingPhase * (eagle.state === 'climb' ? 11 : 5.5));
        wingSweep  = 0;
      }
      const wingAngle = wingFactor * 0.55;

      ctx.save();
      ctx.translate(eagle.x, drawY);
      ctx.rotate(heading);
      ctx.scale(scale, scale);

      if (T.enemyShape === 'owl') {
        renderOwl(wingAngle, wingSweep);
      } else {
        renderEagleSprite(wingAngle, wingSweep);
      }

      ctx.restore();
    }

    function renderEagleSprite(wingAngle, wingSweep) {
      const bodyDark = darkenColor(T.enemy, 0.30);
      const bodyLight = lightenColor(T.enemy, 0.18);

      ctx.save();
      if (T.composite === 'lighter') ctx.globalCompositeOperation = 'lighter';

      // =============== TAIL WEDGE (drawn first, behind everything) ===============
      drawEagleTail(bodyDark);

      // =============== WINGS (rotated by flap angle) ===============
      ctx.save();
      ctx.rotate(-wingAngle + wingSweep);
      drawEagleWing(-1, bodyDark, bodyLight);
      ctx.restore();

      ctx.save();
      ctx.rotate(wingAngle - wingSweep);
      drawEagleWing(1, bodyDark, bodyLight);
      ctx.restore();

      // =============== BODY ===============
      drawEagleBody(bodyDark, bodyLight);

      // =============== HEAD + BEAK ===============
      drawEagleHead(bodyDark, bodyLight);

      ctx.restore();
    }

    function drawEagleTail(bodyDark) {
      // Proper wedge fan (5 individual feathers with visible separation)
      ctx.save();
      ctx.shadowColor = T.enemyGlow;
      ctx.shadowBlur = 8;

      const baseX = -7;
      const tipX = -20;
      const halfW = 7;

      // Base wedge fill (gradient)
      const grad = ctx.createLinearGradient(baseX, 0, tipX, 0);
      grad.addColorStop(0, T.enemy);
      grad.addColorStop(0.6, bodyDark);
      grad.addColorStop(1, T.enemyTip);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(baseX, -2.5);
      ctx.lineTo(baseX, 2.5);
      ctx.quadraticCurveTo(-11, halfW, tipX, halfW * 0.9);
      ctx.quadraticCurveTo(tipX - 1.5, 0, tipX, -halfW * 0.9);
      ctx.quadraticCurveTo(-11, -halfW, baseX, -2.5);
      ctx.closePath();
      ctx.fill();

      // Feather separation lines (radiating from base)
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.lineWidth = 0.5;
      ctx.shadowBlur = 0;
      for (let i = 1; i <= 4; i++) {
        const t = (i / 5) - 0.5;   // -0.3 to +0.3
        ctx.beginPath();
        ctx.moveTo(baseX, t * 2);
        ctx.lineTo(tipX + 1, t * halfW * 2);
        ctx.stroke();
      }

      // Tail tip band (lighter accents at feather tips)
      ctx.fillStyle = T.enemyTip;
      ctx.shadowColor = T.enemyTip;
      ctx.shadowBlur = 4;
      ctx.globalAlpha = 0.7;
      for (let i = 0; i < 5; i++) {
        const t = (i / 4) - 0.5;
        ctx.beginPath();
        ctx.arc(tipX + 0.5, t * halfW * 1.8, 0.8, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      ctx.restore();
    }

    function drawEagleBody(bodyDark, bodyLight) {
      ctx.save();
      ctx.shadowColor = T.enemyGlow;
      ctx.shadowBlur = 12;

      // Smaller, sleeker body (was 13x5, now 10x3.5 — better proportion vs new wingspan)
      const bodyGrad = ctx.createLinearGradient(0, -4, 0, 4);
      bodyGrad.addColorStop(0, bodyDark);
      bodyGrad.addColorStop(0.5, T.enemy);
      bodyGrad.addColorStop(1, bodyLight);
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.ellipse(0, 0, 10, 3.5, 0, 0, Math.PI * 2);
      ctx.fill();

      // Dorsal stripe
      ctx.strokeStyle = 'rgba(0,0,0,0.40)';
      ctx.lineWidth = 0.9;
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.moveTo(-8, 0);
      ctx.lineTo(9, 0);
      ctx.stroke();

      // Body feather texture stipples (skip origami)
      if (!T.paperFold) {
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.arc(-6 + i * 3.5, -1.5, 0.35, 0, Math.PI * 2);
          ctx.arc(-6 + i * 3.5, 1.5, 0.35, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Neck highlight (light chest area between body and head)
      ctx.fillStyle = T.enemyTip;
      ctx.globalAlpha = 0.30;
      ctx.shadowColor = T.enemyTip;
      ctx.shadowBlur = 4;
      ctx.beginPath();
      ctx.ellipse(6, 0, 3.2, 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      // Origami fold along body center
      if (T.paperFold) {
        ctx.strokeStyle = 'rgba(0,0,0,0.20)';
        ctx.lineWidth = 0.7;
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.moveTo(18, 0);
        ctx.lineTo(-9, 0);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawEagleHead(bodyDark, bodyLight) {
      ctx.save();
      ctx.shadowColor = T.enemyGlow;
      ctx.shadowBlur = 8;

      // Head positioned at (12, 0)
      const headGrad = ctx.createRadialGradient(12, -1, 0, 12, 0, 5);
      headGrad.addColorStop(0, bodyLight);
      headGrad.addColorStop(1, T.enemy);
      ctx.fillStyle = headGrad;
      ctx.beginPath();
      ctx.ellipse(12, 0, 3.5, 2.8, 0, 0, Math.PI * 2);
      ctx.fill();

      // Brow ridge
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.lineWidth = 0.7;
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.moveTo(10.8, -1.8);
      ctx.quadraticCurveTo(12.5, -2.6, 13.8, -2.1);
      ctx.moveTo(10.8, 1.8);
      ctx.quadraticCurveTo(12.5, 2.6, 13.8, 2.1);
      ctx.stroke();

      // Eyes
      ctx.fillStyle = T.beak;
      ctx.shadowColor = T.beak;
      ctx.shadowBlur = 4;
      ctx.beginPath();
      ctx.arc(12.5, -1.3, 1.1, 0, Math.PI * 2);
      ctx.arc(12.5, 1.3, 1.1, 0, Math.PI * 2);
      ctx.fill();
      // Pupils
      ctx.fillStyle = '#000';
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(13, -1.3, 0.5, 0, Math.PI * 2);
      ctx.arc(13, 1.3, 0.5, 0, Math.PI * 2);
      ctx.fill();
      // Specular
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath();
      ctx.arc(13.2, -1.5, 0.22, 0, Math.PI * 2);
      ctx.arc(13.2, 1.1, 0.22, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Curved hooked beak
      ctx.save();
      ctx.shadowColor = T.beak;
      ctx.shadowBlur = 4;
      const beakGrad = ctx.createLinearGradient(14, 0, 18, 0);
      beakGrad.addColorStop(0, T.beak);
      beakGrad.addColorStop(1, darkenColor(T.beak, 0.25));
      ctx.fillStyle = beakGrad;
      ctx.beginPath();
      ctx.moveTo(14, -1.2);
      ctx.quadraticCurveTo(17, -1.2, 18.5, 0);
      ctx.quadraticCurveTo(18.7, 0.7, 17.5, 1);
      ctx.quadraticCurveTo(17.7, 0.4, 16.5, 0.4);
      ctx.quadraticCurveTo(14.5, 0.4, 14, 1.2);
      ctx.closePath();
      ctx.fill();
      // Mouth line
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.lineWidth = 0.5;
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.moveTo(14.2, 0);
      ctx.quadraticCurveTo(16.5, 0.1, 18, 0.35);
      ctx.stroke();
      // Nostril
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.beginPath();
      ctx.arc(15.5, -0.35, 0.28, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawEagleWing(side, bodyDark, bodyLight) {
      // Fully spread eagle wing with prominent primary finger feathers.
      // side = -1 (top of top-down view) or +1 (bottom)
      ctx.save();
      ctx.shadowColor = T.enemyGlow;
      ctx.shadowBlur = 12;

      // ---- ARM PORTION: base wing (from body attachment out to primary bases) ----
      const armGrad = ctx.createLinearGradient(0, 0, 0, side * 22);
      armGrad.addColorStop(0, T.enemy);
      armGrad.addColorStop(0.65, bodyDark);
      armGrad.addColorStop(1, T.enemy);
      ctx.fillStyle = armGrad;

      ctx.beginPath();
      // Leading edge — from body, sweeps slightly forward then curves back
      ctx.moveTo(3, side * 3);
      ctx.bezierCurveTo(
        6, side * 8,
        5, side * 16,
        -1, side * 22
      );
      // Wingtip zone (below primary bases)
      ctx.quadraticCurveTo(-8, side * 23, -14, side * 20);
      // Trailing edge — sweeps back to body
      ctx.bezierCurveTo(
        -12, side * 14,
        -8, side * 8,
        -3, side * 3
      );
      ctx.closePath();
      ctx.fill();

      // ---- SECONDARY FEATHERS (trailing edge scallops) ----
      ctx.strokeStyle = 'rgba(0,0,0,0.28)';
      ctx.lineWidth = 0.5;
      ctx.shadowBlur = 0;
      for (let i = 0; i < 5; i++) {
        const t = i / 4;
        // Scallops arc along the trailing edge
        const sx = -3 - t * 10;
        const sy = side * (4 + t * 12);
        const ex = -5 - t * 10;
        const ey = side * (7 + t * 12);
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.quadraticCurveTo((sx + ex) / 2 - 1, (sy + ey) / 2 + side * 0.5, ex, ey);
        ctx.stroke();
      }
      ctx.shadowBlur = 12;

      // ---- PRIMARY "FINGER" FEATHERS (5, prominent & separated) ----
      // Each primary is a tapered feather extending outward from wingtip zone.
      // Positions & lengths chosen so the fan resembles the reference silhouette:
      // - inner primary shortest, points nearly outward
      // - mid primaries longest, sweep back
      // - outer primary shorter, points back
      const primaries = [
        { base: [0,   side * 21], tip: [-1,  side * 33], w: 1.7 },
        { base: [-3,  side * 22], tip: [-6,  side * 35], w: 1.9 },
        { base: [-6,  side * 22.5], tip: [-11, side * 35], w: 2.0 },
        { base: [-9,  side * 22], tip: [-15, side * 33], w: 1.9 },
        { base: [-12, side * 20.5], tip: [-18, side * 29], w: 1.6 },
      ];

      for (const p of primaries) {
        const [bx, by] = p.base;
        const [tx, ty] = p.tip;
        const dx = tx - bx, dy = ty - by;
        const len = Math.hypot(dx, dy);
        const nx = -dy / len, ny = dx / len;   // unit perpendicular
        const w = p.w;

        // Feather gradient — dark toward tip
        const featherGrad = ctx.createLinearGradient(bx, by, tx, ty);
        featherGrad.addColorStop(0, T.enemy);
        featherGrad.addColorStop(0.55, bodyDark);
        featherGrad.addColorStop(1, T.enemy);
        ctx.fillStyle = featherGrad;
        ctx.shadowBlur = 8;

        // Tapered feather (leaf-shaped)
        ctx.beginPath();
        ctx.moveTo(bx - nx * w, by - ny * w);
        ctx.quadraticCurveTo(
          bx + dx * 0.35 - nx * w * 1.05,
          by + dy * 0.35 - ny * w * 1.05,
          bx + dx * 0.80 - nx * w * 0.35,
          by + dy * 0.80 - ny * w * 0.35
        );
        ctx.quadraticCurveTo(tx, ty, bx + dx * 0.80 + nx * w * 0.35, by + dy * 0.80 + ny * w * 0.35);
        ctx.quadraticCurveTo(
          bx + dx * 0.35 + nx * w * 1.05,
          by + dy * 0.35 + ny * w * 1.05,
          bx + nx * w, by + ny * w
        );
        ctx.closePath();
        ctx.fill();

        // Feather shaft
        ctx.strokeStyle = 'rgba(0,0,0,0.42)';
        ctx.lineWidth = 0.45;
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.lineTo(bx + dx * 0.92, by + dy * 0.92);
        ctx.stroke();
      }

      // ---- WING COVERTS (small feather cluster at wing base — layered detail) ----
      ctx.save();
      ctx.fillStyle = bodyLight;
      ctx.globalAlpha = 0.5;
      ctx.shadowBlur = 0;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.ellipse(-1 - i * 1.6, side * (4.5 + i * 2.5), 2.5, 1.4, side * 0.3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // ---- WINGTIP HIGHLIGHT (bright spot at outermost primary tip) ----
      ctx.fillStyle = T.enemyTip;
      ctx.shadowColor = T.enemyTip;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(-18, side * 29, 2, 0, Math.PI * 2);
      ctx.fill();

      // ---- LEADING EDGE ACCENT LINE ----
      ctx.strokeStyle = 'rgba(0,0,0,0.38)';
      ctx.lineWidth = 0.7;
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.moveTo(3, side * 3);
      ctx.bezierCurveTo(6, side * 8, 5, side * 16, -1, side * 22);
      ctx.stroke();

      // ---- ORIGAMI PAPER FOLD ----
      if (T.paperFold) {
        ctx.strokeStyle = 'rgba(0,0,0,0.20)';
        ctx.lineWidth = 0.7;
        ctx.beginPath();
        ctx.moveTo(0, side * 3);
        ctx.lineTo(-8, side * 20);
        ctx.stroke();
      }

      ctx.restore();
    }

    function renderOwl(wingAngle, wingSweep) {
      const bodyDark = darkenColor(T.enemy, 0.30);
      const bodyLight = lightenColor(T.enemy, 0.15);
      const patternColor = 'rgba(80,60,120,0.55)';

      ctx.save();
      if (T.composite === 'lighter') ctx.globalCompositeOperation = 'lighter';

      // =============== TAIL ===============
      ctx.save();
      ctx.shadowColor = T.enemyGlow;
      ctx.shadowBlur = 6;
      const tailFeathers = 4;
      const tailSpread = 0.35;
      for (let i = 0; i < tailFeathers; i++) {
        const t = (i / (tailFeathers - 1)) - 0.5;
        const angle = t * tailSpread;
        ctx.save();
        ctx.translate(-11, 0);
        ctx.rotate(Math.PI + angle);
        const featherGrad = ctx.createLinearGradient(0, 0, 8, 0);
        featherGrad.addColorStop(0, bodyDark);
        featherGrad.addColorStop(0.6, T.enemy);
        featherGrad.addColorStop(1, bodyDark);
        ctx.fillStyle = featherGrad;
        ctx.beginPath();
        ctx.moveTo(0, -1.6);
        ctx.quadraticCurveTo(4, -1.7, 8, -0.5);
        ctx.quadraticCurveTo(9, 0, 8, 0.5);
        ctx.quadraticCurveTo(4, 1.7, 0, 1.6);
        ctx.closePath();
        ctx.fill();
        // Barring pattern on tail feather
        ctx.strokeStyle = 'rgba(0,0,0,0.35)';
        ctx.lineWidth = 0.4;
        ctx.shadowBlur = 0;
        for (let b = 1; b < 4; b++) {
          ctx.beginPath();
          ctx.moveTo(b * 2, -1.4);
          ctx.lineTo(b * 2, 1.4);
          ctx.stroke();
        }
        ctx.shadowBlur = 6;
        ctx.restore();
      }
      ctx.restore();

      // =============== WINGS (broad, rounded) ===============
      ctx.save();
      ctx.rotate(-wingAngle + wingSweep);
      drawOwlWing(-1, bodyDark, bodyLight, patternColor);
      ctx.restore();

      ctx.save();
      ctx.rotate(wingAngle - wingSweep);
      drawOwlWing(1, bodyDark, bodyLight, patternColor);
      ctx.restore();

      // =============== BODY (fat & round) ===============
      ctx.save();
      ctx.shadowColor = T.enemyGlow;
      ctx.shadowBlur = 14;

      const bodyGrad = ctx.createRadialGradient(0, 0, 2, 0, 2, 10);
      bodyGrad.addColorStop(0, bodyLight);
      bodyGrad.addColorStop(0.7, T.enemy);
      bodyGrad.addColorStop(1, bodyDark);
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.ellipse(0, 0, 11, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      // Belly barring pattern (owl signature)
      ctx.shadowBlur = 0;
      ctx.strokeStyle = patternColor;
      ctx.lineWidth = 0.6;
      for (let i = 0; i < 4; i++) {
        const y = -3 + i * 2;
        ctx.beginPath();
        ctx.moveTo(-6, y);
        ctx.quadraticCurveTo(0, y - 0.5, 6, y);
        ctx.stroke();
      }

      // Belly V-spots (denser center pattern)
      ctx.fillStyle = patternColor;
      for (let i = 0; i < 6; i++) {
        const col = i % 2;
        const row = Math.floor(i / 2);
        ctx.beginPath();
        ctx.arc(-2 + col * 4, -3 + row * 3, 0.6, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // =============== HEAD (big & round) ===============
      ctx.save();
      ctx.shadowColor = T.enemyGlow;
      ctx.shadowBlur = 12;

      const headGrad = ctx.createRadialGradient(8, -2, 0, 8, 0, 8);
      headGrad.addColorStop(0, bodyLight);
      headGrad.addColorStop(1, T.enemy);
      ctx.fillStyle = headGrad;
      ctx.beginPath();
      ctx.arc(8, 0, 7, 0, Math.PI * 2);
      ctx.fill();

      // Ear tufts (asymmetric little horns)
      ctx.fillStyle = bodyDark;
      ctx.shadowBlur = 4;
      ctx.beginPath();
      ctx.moveTo(4.5, -5.8);
      ctx.quadraticCurveTo(3.5, -10, 5, -10.5);
      ctx.quadraticCurveTo(6.5, -8, 6.5, -6);
      ctx.closePath();
      ctx.moveTo(4.5, 5.8);
      ctx.quadraticCurveTo(3.5, 10, 5, 10.5);
      ctx.quadraticCurveTo(6.5, 8, 6.5, 6);
      ctx.closePath();
      ctx.fill();

      // Facial disc — heart-shaped outline (owl characteristic)
      ctx.save();
      ctx.strokeStyle = bodyDark;
      ctx.lineWidth = 0.6;
      ctx.shadowBlur = 0;
      ctx.beginPath();
      // Upper facial disc boundary (goes above eyes, curves down to beak)
      ctx.moveTo(4, -5);
      ctx.quadraticCurveTo(8, -6.5, 12, -4);
      // Right side down
      ctx.quadraticCurveTo(14, 0, 12, 4);
      ctx.quadraticCurveTo(8, 6.5, 4, 5);
      // Below chin
      ctx.quadraticCurveTo(6, 2, 6, 0);
      ctx.quadraticCurveTo(6, -2, 4, -5);
      ctx.stroke();
      ctx.restore();

      // Eye "surround" — slight darkening rings around eyes
      ctx.fillStyle = bodyDark;
      ctx.globalAlpha = 0.5;
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(10, -3, 3.3, 0, Math.PI * 2);
      ctx.arc(10,  3, 3.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      // Large forward-facing eyes (yellow with subtle radial gradient)
      const eyeGrad = ctx.createRadialGradient(10, -3, 0, 10, -3, 3);
      eyeGrad.addColorStop(0, '#ffee88');
      eyeGrad.addColorStop(0.6, T.enemyTip);
      eyeGrad.addColorStop(1, '#cc9900');
      ctx.fillStyle = eyeGrad;
      ctx.shadowColor = T.enemyTip;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(10, -3, 2.6, 0, Math.PI * 2);
      ctx.fill();

      const eyeGrad2 = ctx.createRadialGradient(10, 3, 0, 10, 3, 3);
      eyeGrad2.addColorStop(0, '#ffee88');
      eyeGrad2.addColorStop(0.6, T.enemyTip);
      eyeGrad2.addColorStop(1, '#cc9900');
      ctx.fillStyle = eyeGrad2;
      ctx.beginPath();
      ctx.arc(10,  3, 2.6, 0, Math.PI * 2);
      ctx.fill();

      // Pupils (large — owl pupils dilate at night)
      ctx.fillStyle = '#000';
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(10.5, -3, 1.3, 0, Math.PI * 2);
      ctx.arc(10.5,  3, 1.3, 0, Math.PI * 2);
      ctx.fill();
      // Eye specular
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath();
      ctx.arc(10.8, -3.4, 0.4, 0, Math.PI * 2);
      ctx.arc(10.8,  2.6, 0.4, 0, Math.PI * 2);
      ctx.fill();
      // Small secondary reflection
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath();
      ctx.arc(10.2, -2.4, 0.25, 0, Math.PI * 2);
      ctx.arc(10.2,  3.4, 0.25, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();

      // =============== BEAK (small hooked triangle between eyes) ===============
      ctx.save();
      ctx.shadowColor = T.beak;
      ctx.shadowBlur = 3;
      ctx.fillStyle = T.beak;
      ctx.beginPath();
      ctx.moveTo(13.5, -1);
      ctx.quadraticCurveTo(15.5, -0.5, 15.5, 0);
      ctx.quadraticCurveTo(15.5, 0.5, 13.5, 1);
      ctx.quadraticCurveTo(13, 0, 13.5, -1);
      ctx.closePath();
      ctx.fill();
      // Beak shading
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.lineWidth = 0.4;
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.moveTo(13.5, 0);
      ctx.lineTo(15.3, 0);
      ctx.stroke();
      ctx.restore();

      ctx.restore();
    }

    function drawOwlWing(side, bodyDark, bodyLight, patternColor) {
      ctx.save();
      ctx.shadowColor = T.enemyGlow;
      ctx.shadowBlur = 13;

      // --- Broad, rounded wing outline (owl wings are wider than eagle's) ---
      const wingGrad = ctx.createLinearGradient(0, 0, 0, side * 20);
      wingGrad.addColorStop(0, T.enemy);
      wingGrad.addColorStop(0.7, bodyDark);
      wingGrad.addColorStop(1, T.enemy);
      ctx.fillStyle = wingGrad;
      ctx.beginPath();
      ctx.moveTo(-3, side * 4);
      // Trailing edge (broad curve)
      ctx.quadraticCurveTo(-17, side * 12, -13, side * 20);
      // Wing tip (rounded — no sharp finger feathers, unlike eagle)
      ctx.quadraticCurveTo(-4, side * 22, 2, side * 12);
      // Leading edge back to body
      ctx.quadraticCurveTo(4, side * 6, 3, side * 3);
      ctx.closePath();
      ctx.fill();

      // --- Barring pattern (owl signature — bars across wing) ---
      ctx.strokeStyle = patternColor;
      ctx.lineWidth = 0.7;
      ctx.shadowBlur = 0;
      for (let i = 0; i < 4; i++) {
        const t = 0.2 + i * 0.18;
        ctx.beginPath();
        // Bar arcs across wing from leading edge to trailing edge
        const startX = 3 - t * 15;
        const startY = side * (3 + t * 3);
        const endX = -13 + t * 10;
        const endY = side * (20 - t * 5);
        const midX = (startX + endX) / 2 - 2;
        const midY = (startY + endY) / 2 + side * 1;
        ctx.moveTo(startX, startY);
        ctx.quadraticCurveTo(midX, midY, endX, endY);
        ctx.stroke();
      }

      // --- Wing spot pattern (soft feathery dots) ---
      ctx.save();
      ctx.fillStyle = patternColor;
      for (let i = 0; i < 8; i++) {
        const angle = (i / 8) * Math.PI * 0.6;
        const r = 6 + (i % 3) * 3;
        const px = -3 + Math.cos(angle) * -r;
        const py = side * (4 + Math.sin(angle) * r * 0.9);
        ctx.beginPath();
        ctx.arc(px, py, 0.7, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // --- Coverts (small feather layer at wing base) ---
      ctx.save();
      ctx.fillStyle = bodyLight;
      ctx.globalAlpha = 0.4;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.ellipse(-2 - i * 1.8, side * (5 + i * 2), 2.8, 1.8, side * 0.3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // --- Trailing edge highlight (soft light on outer feathers) ---
      ctx.fillStyle = bodyLight;
      ctx.globalAlpha = 0.4;
      ctx.shadowBlur = 8;
      ctx.shadowColor = bodyLight;
      ctx.beginPath();
      ctx.ellipse(-8, side * 18, 4, 1.5, side * 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      ctx.restore();
    }

    // ================= STRIKE PARTICLES =================
    const particles = [];
    function spawnStrike(x, y) {
      // With reduced motion only the ring stays: it still shows where the talons came down.
      for (let i = 0; i < (reducedMotion ? 0 : 22); i++) {
        const a = (i / 22) * Math.PI * 2 + Math.random() * 0.4;
        const s = 90 + Math.random() * 160;
        particles.push({
          x, y,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s,
          life: 700, maxLife: 700,
          color: i % 3 === 0 ? '#ffffff' : (i % 3 === 1 ? T.enemy : T.enemyTip),
          size: 2 + Math.random() * 1.5,
        });
      }
      particles.push({
        x, y, vx: 0, vy: 0,
        life: 500, maxLife: 500,
        ring: true, radius: 5,
        color: T.enemyTip,
      });
    }
    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        const dtSec = dt / 1000;
        if (p.ring) {
          p.radius += 200 * dtSec;
        } else {
          p.x += p.vx * dtSec;
          p.y += p.vy * dtSec;
          p.vx *= Math.pow(0.05, dtSec);
          p.vy *= Math.pow(0.05, dtSec);
        }
      }
    }
    function renderParticles() {
      ctx.save();
      if (T.composite === 'lighter') ctx.globalCompositeOperation = 'lighter';
      for (const p of particles) {
        const a = p.life / p.maxLife;
        if (p.ring) {
          ctx.strokeStyle = p.color;
          ctx.globalAlpha = a * 0.8;
          ctx.lineWidth = 3 * a;
          ctx.shadowBlur = 12; ctx.shadowColor = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.stroke();
        } else {
          ctx.fillStyle = p.color;
          ctx.globalAlpha = a;
          ctx.shadowBlur = 12; ctx.shadowColor = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    // ================= BACKGROUND =================
    const drift = [];
    for (let i = 0; i < 40; i++) {
      drift.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: -6 - Math.random() * 12,
        vy: (Math.random() - 0.5) * 4,
        r: 0.6 + Math.random() * 1.2,
        hueIdx: Math.random() < 0.6 ? 0 : 1,
        phase: Math.random() * Math.PI * 2,
      });
    }
    // Stars (static positions, only shown when T.stars)
    const stars = [];
    for (let i = 0; i < 60; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.9,
        r: 0.5 + Math.random() * 1.4,
        phase: Math.random() * Math.PI * 2,
        twinkleSpeed: 0.001 + Math.random() * 0.003,
      });
    }

    function updateDrift(dt) {
      const dtSec = dt / 1000;
      for (const d of drift) {
        if (T.risingParticles) {
          // Bubbles: rise upward with gentle horizontal wobble
          d.x += Math.sin((d.phase + performance.now() * 0.001)) * 8 * dtSec;
          d.y -= (30 + d.r * 10) * dtSec;
          if (d.y < -10) {
            d.y = H + 10;
            d.x = Math.random() * W;
          }
        } else if (T.sandBlow) {
          // Sand: strong horizontal blow, minimal vertical
          d.x += d.vx * 2.2 * dtSec;
          d.y += d.vy * 0.4 * dtSec;
          if (d.x < -10) { d.x = W + 10; d.y = Math.random() * H; }
          if (d.y < -10) d.y = H + 10;
          if (d.y > H + 10) d.y = -10;
        } else {
          d.x += d.vx * dtSec;
          d.y += d.vy * dtSec;
          if (d.x < -10) { d.x = W + 10; d.y = Math.random() * H; }
          if (d.y < -10) d.y = H + 10;
          if (d.y > H + 10) d.y = -10;
        }
      }
    }

    function renderGrid(time) {
      // ---- STATIC LAYER (blit cached bg + vignette + grid + moon) ----
      ensureStaticLayer();
      ctx.drawImage(staticLayer, 0, 0);

      // ---- STARS twinkle (dynamic — Midnight only) ----
      if (T.stars) {
        ctx.save();
        for (const s of stars) {
          const twinkle = 0.4 + 0.6 * Math.abs(Math.sin(time * s.twinkleSpeed + s.phase));
          ctx.fillStyle = `rgba(255,255,220,${twinkle})`;
          ctx.shadowBlur = 4;
          ctx.shadowColor = '#ffeecc';
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r * twinkle, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      // ---- DRIFT PARTICLES (dynamic) ----
      ctx.save();
      if (T.composite === 'lighter') ctx.globalCompositeOperation = 'lighter';
      for (const d of drift) {
        const pulse = 0.5 + 0.5 * Math.sin(time * 0.002 + d.phase);
        const color = T.driftColors[d.hueIdx].replace('ALPHA', (0.25 * pulse).toFixed(2));
        ctx.fillStyle = color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = color;
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // ================= UTILITIES =================
    function lerpColor(c1, c2, t) {
      const p = c => [
        parseInt(c.slice(1,3),16),
        parseInt(c.slice(3,5),16),
        parseInt(c.slice(5,7),16),
      ];
      const [r1,g1,b1] = p(c1);
      const [r2,g2,b2] = p(c2);
      return `rgb(${Math.round(r1+(r2-r1)*t)},${Math.round(g1+(g2-g1)*t)},${Math.round(b1+(b2-b1)*t)})`;
    }
    // Lighten a hex color toward white by factor (0..1)
    function lightenColor(hex, factor) {
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      const lr = Math.round(r + (255 - r) * factor);
      const lg = Math.round(g + (255 - g) * factor);
      const lb = Math.round(b + (255 - b) * factor);
      return `rgb(${lr},${lg},${lb})`;
    }
    // Darken a hex color toward black by factor (0..1)
    function darkenColor(hex, factor) {
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      const dr = Math.round(r * (1 - factor));
      const dg = Math.round(g * (1 - factor));
      const db = Math.round(b * (1 - factor));
      return `rgb(${dr},${dg},${db})`;
    }

    // ================= MAIN LOOP =================
    /** One step of everything that moves in play. */
    function stepWorld(dt) {
      updateSnake(dt);
      updateDecoys();
      updateRivals(dt);
      updateHunters(dt);
      checkContacts();
      if (rules.mode && game.state === 'playing') rules.mode.step?.(modeApi, dt);
      updateApples(dt);
      updateEagle(dt);
      updateParticles(dt);
    }

    let lastTime = performance.now();
    function loop(time) {
      // Paused (the Hall's menu, a hidden tab), the scene holds still and the clock waits.
      const dt = paused ? 0 : Math.min(50, time - lastTime);
      lastTime = time;

      if (game.state !== 'playing') game.overOffTime += dt;

      updateDrift(dt);
      stepWorld(dt);

      renderGrid(time);
      renderExits(time);
      renderFences(time);
      rules.mode?.under?.(ctx, modeApi, time);
      renderApples(time);
      renderRivals(time);
      renderDecoys(time);
      renderPeckWarnings();
      renderParticles();

      // Fade snake gradually during death, hide fully after a moment.
      if (game.state === 'dead') {
        const t = Math.min(1, game.overOffTime / 400);
        ctx.save();
        ctx.globalAlpha = 1 - t;
        renderSnake(time);
        ctx.restore();
      } else {
        renderSnake(time);
      }

      renderHunters(time);
      renderEagle(time);
      rules.mode?.over?.(ctx, modeApi, time);
      emit({ type: 'frame', canvas });

      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // ================= THE DESK'S HANDLE =================
    window.TalonGame = {
      themes: Object.fromEntries(Object.entries(THEMES).map(([key, t]) => [key, { name: t.name, swatch: t.swatch }])),
      on(listen) { listeners.push(listen); },
      /** The desk is open: the region's scene in the background, the bird circling. */
      showMenu(theme) {
        setTheme(theme);
        hideOverlay();
        game.state = 'menu';
        game.score = 0;
        rules = PORT_RULES;
        rivals.length = 0;
        hunters.length = 0;
        decoys.length = 0;
        eagle.quarry = null;
        initApples();
        updateScoreDisplay();
      },
      /**
       * A flight in a region: its scene, its bird, its rules (src/rules.mjs: fence, harvest,
       * rivals, carrying), the best escape the line under the field shows, and (for the Daily
       * Flight) its random draw.
       */
      begin({ theme, tuning, rules: flightRules, random, best = 0 }) {
        setTheme(theme);
        tune = { ...ORIGINAL_TUNE, ...tuning };
        rules = flightRules || PORT_RULES;
        rand = random || Math.random;
        game.bestScore = best;
        game.birdAsleep = false;
        game.birdHunger = 1;
        game.diveQuickening = 1;
        game.fruitSpot = null;
        modeApi.state = {};
        restartGame();
        rules.mode?.start?.(modeApi);
        emit({ type: 'start', left: fruitLeft() });
      },
      setPaused(value) { paused = value; },
      /** The handle a challenge's mode plays on (the desk reads its status and result). */
      get modeApi() { return modeApi; },
      /** Space in a flight: shed the tail as a decoy, if it can be shed now. */
      shedTail() { return shedTail(); },
      setReducedMotion(value) { reducedMotion = value; },
      get state() { return game.state; },
      get score() { return game.score; },
      /** For the browser tests and the balance check: what is on the field. */
      peek() {
        return { head: { ...snake.segments[0] }, heading: { dx: snake.dx, dy: snake.dy },
          length: snake.segments.length, carried: game.score, left: fruitLeft(), bare: game.bare,
          rivalsAte: game.rivalsAte, rivalsTaken: game.rivalsTaken, rivalsCutOff: game.rivalsCutOff,
          withered: game.withered,
          leaving: game.leaving?.edge ?? null,
          apples: apples.map((a) => ({ x: a.x, y: a.y })),
          rivals: rivals.map((r) => ({ x: r.segments[0].x, y: r.segments[0].y, ate: r.ate,
            body: r.segments.filter((_, i) => i >= NECK && i % 3 === 0).map((s) => ({ x: s.x, y: s.y })) })),
          hunters: hunters.map((h) => ({ x: h.x, y: h.y, state: h.state, aim: h.aim })),
          pecks: game.pecks, huntersAte: game.huntersAte,
          fences: rules.fences,
          eagle: { state: eagle.state, x: eagle.x, y: eagle.y, targetX: eagle.targetX, targetY: eagle.targetY,
            lockMs: eagle.lockMs, diveMs: eagle.diveMs, quarry: quarryKind() },
          decoys: decoys.length, shedReadyIn: Math.max(0, game.shedReadyAt - game.clock),
          selfCollision: Boolean(rules.selfCollision),
          body: snake.segments.filter((_, i) => i >= 16 && i % 3 === 0).map((s) => ({ x: s.x, y: s.y })),
          size: { width: W, height: H } };
      },
      /**
       * For the balance check: plays on without drawing, `stepMs` at a time, asking
       * `steer(peek)` for a direction ({ dx, dy }, or nothing to keep on) before every step,
       * until the flight ends or `limitMs` has passed. Returns the game's state and the time.
       */
      fastForward(limitMs, steer, stepMs = 16) {
        let t = 0;
        for (; t < limitMs && game.state === 'playing'; t += stepMs) {
          const want = steer(this.peek());
          if (want) { input.dx = want.dx; input.dy = want.dy; }
          stepWorld(stepMs);
        }
        return { state: game.state, ms: t };
      },
      /**
       * For the browser tests of the desk's flow (reports, the ending, the Daily Flight): the
       * hunters leave, and unless kept the rivals too and the bird stops locking on, so
       * teleporting the head about cannot end the flight by accident.
       */
      clearThreats({ keepBird = false, keepRivals = false } = {}) {
        hunters.length = 0;
        if (!keepRivals) rivals.length = 0;
        if (keepBird) return;
        eagle.patience = Infinity;
        eagle.quarry = null;
        if (eagle.state !== 'glide') { eagle.state = 'climb'; eagle.stateTime = 0; }
      },
      /** For the browser tests: put the head somewhere, as if it had slithered there. */
      placeHead(x, y) {
        const head = snake.segments[0];
        const dx = x - head.x;
        const dy = y - head.y;
        for (const segment of snake.segments) { segment.x += dx; segment.y += dy; }
      },
    };
    document.dispatchEvent(new Event('talon-ready'));
  })();
  </script>
  <script type="module" src="src/desk.mjs"></script>
</body>
