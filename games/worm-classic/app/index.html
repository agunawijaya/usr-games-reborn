    // Steady pace (added in the collection, a setting of the desk): the worm keeps the port's
    // Classic tick however long it grows, instead of speeding up with its length.
    let steadyPace = false;

    function updateTickInterval() {
      const s = settings.speed;
      let interval;
      if (s === 'classic' || (s === 'progressive' && steadyPace)) {
        interval = 333;                    // 3× — comfortable retro pace
      } else if (s === 'fast') {
        interval = 167;                    // 6× — modern arcade
      } else {
        // Progressive: 333ms at length 5 → 167ms at length 45+
        // (starts at Classic, ramps to Fast as worm grows)
        const len = worm.segments.length;
        const t = Math.min(1, Math.max(0, (len - 5) / 40));
        interval = Math.round(333 - t * 166);
      }
      worm.tickInterval = interval;
      tickLabel.textContent = `${(interval / 1000).toFixed(2)}s`;
    }

    // ================= INPUT =================
    document.addEventListener('keydown', (e) => {
      if (paused || demo || e.ctrlKey || e.metaKey || e.altKey) return;
      // With the desk, its report card handles what comes next.
      if (game.state !== 'playing' && controlled()) return;
      if (game.state !== 'playing') {
        if (game.canRestart) { restartGame(); e.preventDefault(); }
        return;
      }

      const k = e.key.toLowerCase();
      let dx = 0, dy = 0, valid = false;
      if (k === 'arrowright' || k === 'd') { dx = 1;  dy = 0;  valid = true; }
      else if (k === 'arrowleft' || k === 'a') { dx = -1; dy = 0;  valid = true; }
      else if (k === 'arrowup' || k === 'w') { dx = 0;  dy = -1; valid = true; }
      else if (k === 'arrowdown' || k === 's') { dx = 0;  dy = 1;  valid = true; }
      if (!valid) return;
      e.preventDefault();

      // Nokia-snake input buffer — queue up to 2 turns so rapid double-taps
      // both register in sequence.
      // Reverse/no-op checks are against the LAST INTENT (last queued if any,
      // else the currently-committed direction), not the committed direction.
      // This lets you press ↑ then ← quickly and both turns happen on
      // successive ticks — instead of the ← being rejected as reverse of
      // the pre-turn "right".
      const lastIntent = worm.directionQueue.length > 0
        ? worm.directionQueue[worm.directionQueue.length - 1]
        : worm.direction;
      if (dx === -lastIntent.dx && dy === -lastIntent.dy) return;   // 180° block
      if (dx ===  lastIntent.dx && dy ===  lastIntent.dy) return;   // no-op
      if (worm.directionQueue.length >= 2) return;                  // cap depth
      if (!turnAllowed(lastIntent, dx, dy)) return;                 // a challenge's rule
      worm.directionQueue.push({ dx, dy });
    });

    // ================= TICK LOGIC (BSD spec) =================
    function doTick() {
      if (game.state !== 'playing') return;

      // TURN ACCURACY: move FIRST in current direction, then commit pending
      // direction at end of tick. Turn visually happens at the cell the eye
      // reached (not at the neck).
      //
      // INPUT RESCUE: if moving in current direction WOULD kill (wall or self)
      // AND the pending direction differs, commit pending NOW instead. This
      // preserves player intent when they press turn late — e.g. right after
      // eating an apple at the edge — instead of dying on a stale direction.
      // Rescue only fires in the death-adjacent case, so normal turns still
      // land at the eye position.

      const oldHead = worm.segments[0];

      function isDeadly(cell) {
        if (cell.x < 0 || cell.x >= GRID.cols ||
            cell.y < 0 || cell.y >= GRID.rows) return true;
        const willShrinkTail = worm.growing === 0;
        const checkUntil = willShrinkTail
          ? worm.segments.length - 1
          : worm.segments.length;
        for (let i = 0; i < checkUntil; i++) {
          if (worm.segments[i].x === cell.x &&
              worm.segments[i].y === cell.y) return true;
        }
        // Ruleset A (Snake, symmetric): rival body/head is a wall to player head
        if (rival.active) {
          for (const s of rival.segments) {
            if (s.x === cell.x && s.y === cell.y) return true;
          }
        }
        // Fence is a static wall to player head
        if (isCellFence(cell.x, cell.y)) return true;
        return false;
      }

      const currDir = worm.direction;
      const pendDir = worm.directionQueue.length > 0
        ? worm.directionQueue[0]
        : currDir;
      const pendingDiffers =
        (pendDir.dx !== currDir.dx) || (pendDir.dy !== currDir.dy);

      let newHead = { x: oldHead.x + currDir.dx, y: oldHead.y + currDir.dy };

      if (pendingDiffers && isDeadly(newHead)) {
        // Input rescue — pull the queued turn forward to honor player intent
        worm.direction = pendDir;
        worm.directionQueue.shift();
        newHead = { x: oldHead.x + pendDir.dx, y: oldHead.y + pendDir.dy };
      }

      // Home: the head reaches the open burrow (added in the collection).
      if (burrow && newHead.x === burrow.x && newHead.y === burrow.y) {
        return enterBurrow(newHead);
      }

      // A limit on going straight (a challenge's rule): one move too many in one direction ends
      // the crawl.
      const moveDx = newHead.x - oldHead.x;
      const moveDy = newHead.y - oldHead.y;
      straightRun = moveDx === lastMove.dx && moveDy === lastMove.dy ? straightRun + 1 : 1;
      lastMove = { dx: moveDx, dy: moveDy };
      if (straightRun > settings.maxStraight) return triggerDeath('straight');

      // Death: wall (may still fire if rescue direction is also deadly)
      if (newHead.x < 0 || newHead.x >= GRID.cols ||
          newHead.y < 0 || newHead.y >= GRID.rows) {
        return triggerDeath('wall');
      }

      // Death: self collision (rescue direction re-checked here too)
      {
        const willShrinkTail = worm.growing === 0;
        const checkUntil = willShrinkTail
          ? worm.segments.length - 1
          : worm.segments.length;
        for (let i = 0; i < checkUntil; i++) {
          if (worm.segments[i].x === newHead.x &&
              worm.segments[i].y === newHead.y) {
            return triggerDeath('self');
          }
        }
      }

      // Death: fence
      if (isCellFence(newHead.x, newHead.y)) {
        return triggerDeath('fence');
      }

      // ---- Rival interactions (before advancing player head) ----
      // Ruleset A (Snake, symmetric):
      //   player head → rival head = both die (mutual crash)
      //   player head → rival body = PLAYER dies (rival body is a wall)
      // No slither.io bonus. Attacking the rival's body kills you the same
      // as running into a wall.
      if (rival.active && rival.segments.length > 0) {
        const rHead = rival.segments[0];
        if (newHead.x === rHead.x && newHead.y === rHead.y) {
          killRival(clock, false, 'head-on');
          return triggerDeath('rival-head');
        }
        if (isCellRivalBody(newHead.x, newHead.y, true)) {
          return triggerDeath('rival-body');
        }
      }

      // Add new head
      worm.segments.unshift(newHead);

      // Eat apple? — check BEFORE tail resolution, matches BSD source
      for (let ai = 0; ai < apples.length; ai++) {
        const a = apples[ai];
        if (newHead.x === a.x && newHead.y === a.y) {
          worm.growing += a.value;                 // BSD: growing += ch - '0'
          spawnPickupBurst(a.x, a.y, a.value);
          game.score += worm.growing;               // BSD: score += growing (chained bonus!)
          updateScoreDisplay();
          apples.splice(ai, 1);
          respawnAfterEat();                        // Pure=instant, Wild=delayed 2.5s
          game.harvested++;
          game.bestBite = Math.max(game.bestBite, worm.growing);
          // The length to come: the new head is on, and this move's tail step (a cell of growth
          // used up rather than the tail let go) has still to happen, hence the one less.
          emit({ type: 'bite', value: a.value, points: worm.growing, rotten: a.state === 'rotten',
            harvested: game.harvested, score: game.score, length: worm.segments.length + worm.growing - 1 });
          if (!burrow && game.harvested >= settings.harvest) openBurrow();
          break;
        }
      }

      // Frog bonus?
      if (frog.active && newHead.x === frog.x && newHead.y === frog.y) {
        game.score += FROG_SCORE;
        spawnFrogEatBurst(frog.x, frog.y);
        updateScoreDisplay();
        despawnFrog(clock);
        emit({ type: 'frog-caught', points: FROG_SCORE, score: game.score });
      }

      // Tail resolution
      if (worm.growing === 0) {
        worm.segments.pop();
      } else {
        worm.growing--;
      }

      // Update progressive speed after growth
      if (settings.speed === 'progressive') updateTickInterval();
      updateLengthDisplay();

      // Win check (fill entire grid; fences take cells away from it)
      if (worm.segments.length >= freeCells() - 1) {
        triggerWin();
      }
      emit({ type: 'moved', length: worm.segments.length, growing: worm.growing });

      // Advance rival AI one tick (after player). Kills / collisions handled
      // inside doRivalTick.
      if (settings.enemyRival && rival.active) {
        doRivalTick(clock);
        if (game.state !== 'playing') return;
      }

      // A burrow that found no room when the harvest came in tries again every tick.
      if (!burrow && game.harvested >= settings.harvest) openBurrow();

      // Commit pending direction for NEXT tick (turn accuracy fix)
      // Consume next queued turn (Nokia-snake buffer) — one per tick, so a
      // double-tap plays back as two sequential turns.
      if (worm.directionQueue.length > 0) {
        worm.direction = worm.directionQueue.shift();
      }
    }

    // ================= DEATH / WIN =================
    function triggerDeath(reason) {
      if (game.state !== 'playing') return;
      game.state = 'dead';
      game.overOffTime = 0;
      game.canRestart = false;
      const head = worm.segments[0];
      spawnDeathBurst(head.x, head.y);
      emit({ type: 'crash', reason });
      if (controlled()) return;
      if (game.score > game.bestScore) {
        game.bestScore = game.score;
        updateScoreDisplay();
      }
      let sub;
      if (reason === 'wall')             sub = 'crashed into the wall';
      else if (reason === 'wasp')        sub = 'stung by a wasp';
      else if (reason === 'gardener')    sub = 'trampled by the gardener';
      else if (reason === 'rival-head')  sub = 'head-on with the rival';
      else if (reason === 'rival-body')  sub = 'crashed into the rival';
      else if (reason === 'fence')       sub = 'crashed into the fence';
      else                               sub = 'tangled with your own body';
      showOverlay('dead', 'CAUGHT', sub, 'press any key');
    }

    function triggerWin() {
      if (game.state !== 'playing') return;
      game.state = 'won';
      game.overOffTime = 0;
      game.canRestart = false;
      emit({ type: 'filled' });
      if (controlled()) return;
      if (game.score > game.bestScore) {
        game.bestScore = game.score;
        updateScoreDisplay();
      }
      showOverlay('win', 'GARDEN FILLED', `${game.score} chained points`, 'press any key');
    }

    function showOverlay(cls, title, sub, instr) {
      gameOverlay.innerHTML = `
        <div class="go-title ${cls}">${title}</div>
        <div class="go-sub">${sub}</div>
        <div class="go-instr">${instr}</div>
      `;
      setTimeout(() => gameOverlay.classList.add('visible'), 40);
      setTimeout(() => { game.canRestart = true; }, 550);
    }
    function hideOverlay() {
      gameOverlay.classList.remove('visible');
      gameOverlay.innerHTML = '';
    }

    function updateScoreDisplay() {
      scoreLabel.textContent = game.score;
      bestLabel.textContent = game.bestScore;
    }
    function updateLengthDisplay() {
      lengthLabel.textContent = worm.segments.length;
    }

    function restartGame() {
      game.state = 'playing';
      game.score = 0;
      game.harvested = 0;
      game.bestBite = 0;
      burrow = null;
      burrowTimer = 0;
      straightRun = 0;
      lastMove = { dx: 0, dy: 0 };
      hideOverlay();
      setBoard(settings.board ? settings.board.cols : 30, settings.board ? settings.board.rows : 20);
      rebuildFences();
      initWorm();
      initApples();
      frog.active = false;
      bird.active = false;
      wasps.length = 0;
      gardener.active = false;
      rival.active = false;
      rival.segments = [];
      scheduleNextFrog(clock, true);
      scheduleNextBird(clock, true);
      scheduleNextGardener(clock, true);
      scheduleNextRival(clock, true);
      particles.length = 0;
      if (settings.burrowAt) burrow = { x: settings.burrowAt.x, y: settings.burrowAt.y, openedAt: clock };
      updateScoreDisplay();
      updateLengthDisplay();
      updateTickInterval();
    }

    // ================= THE CHALLENGES' RULES (added in the collection) =================
    let straightRun = 0;
    let lastMove = { dx: 0, dy: 0 };

    /** Right turns only: from heading (dx, dy) the one clockwise turn is (-dy, dx). */
    function turnAllowed(from, dx, dy) {
      return settings.turns !== 'right' || (dx === -from.dy && dy === from.dx);
    }

    function freeCells() {
      return GRID.cols * GRID.rows - fences.length;
    }

    /** The board for a crawl: the port's 30 by 20, or a challenge's own size. */
    function setBoard(cols, rows) {
      if (GRID.cols === cols && GRID.rows === rows) return;
      GRID.cols = cols;
      GRID.rows = rows;
      W = cols * GRID.cellSize;
      H = rows * GRID.cellSize;
      invalidateStaticLayer();
      seedSky();
    }

    /** Where the board sits in the canvas: scaled to fit and centred. */
    function boardFit() {
      const scale = Math.min(VIEW_W / W, VIEW_H / H);
      return { scale, x: (VIEW_W - W * scale) / 2, y: (VIEW_H - H * scale) / 2 };
    }

    /** Round a smaller board, a dark hedge in the colours of the look. */
    function renderHedge(fit) {
      const top = T.bgGradient ? T.bgGradient[0].color : T.bg;
      const bottom = T.bgGradient ? T.bgGradient[T.bgGradient.length - 1].color : T.bg;
      const g = ctx.createLinearGradient(0, 0, 0, VIEW_H);
      g.addColorStop(0, darkenColor(top, 0.62));
      g.addColorStop(1, darkenColor(bottom, 0.7));
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      ctx.save();
      ctx.shadowBlur = 24;
      ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
      ctx.fillStyle = darkenColor(bottom, 0.5);
      ctx.fillRect(fit.x, fit.y, W * fit.scale, H * fit.scale);
      ctx.restore();
    }

    // ================= THE BURROW (added in the collection) =================
    // When the orchard's harvest is in, a burrow opens on a free cell the worm can reach (the
    // desk's rules choose it). Crawling into it ends the crawl: the worm slides in, a cell at a
    // time along its own path, and nothing in the orchard can touch it any more.
    const BURROW_SLIDE_MS = 1800;     // about how long the whole worm takes to go in

    function openBurrow() {
      const head = worm.segments[0];
      const walls = new Set(worm.segments.map((c) => `${c.x},${c.y}`));
      for (const f of fences) walls.add(`${f.x},${f.y}`);
      if (rival.active) for (const r of rival.segments) walls.add(`${r.x},${r.y}`);
      const taken = new Set(apples.map((a) => `${a.x},${a.y}`));
      if (frog.active) taken.add(`${frog.x},${frog.y}`);
      const spot = settings.placeBurrow({
        cols: GRID.cols, rows: GRID.rows, head: { x: head.x, y: head.y },
        walls, taken, random: draw.place,
      });
      if (!spot) return;
      burrow = { x: spot.x, y: spot.y, openedAt: clock };
      spawnBurrowBurst(burrow.x, burrow.y);
      emit({ type: 'burrow-open', x: burrow.x, y: burrow.y });
    }

    function enterBurrow(cell) {
      worm.segments.unshift({ x: cell.x, y: cell.y });
      worm.segments.pop();
      worm.directionQueue = [];
      // Whatever was still to grow no longer matters: the tail follows the body straight in.
      worm.growing = 0;
      worm.interpolation = 0;
      game.state = 'burrowing';
      burrowTimer = 0;
      emit({ type: 'burrowing' });
    }

    /** A short worm goes in at a crawl, a long one quicker, so none keeps the player waiting. */
    function burrowStepMs() {
      return Math.max(25, Math.min(70, BURROW_SLIDE_MS / Math.max(1, worm.segments.length)));
    }

    function stepBurrowing(dt) {
      const step = burrowStepMs();
      burrowTimer += dt;
      while (burrowTimer >= step && game.state === 'burrowing') {
        burrowTimer -= step;
        worm.segments.unshift({ x: burrow.x, y: burrow.y });
        worm.segments.pop();
        if (worm.segments.every((s) => s.x === burrow.x && s.y === burrow.y)) {
          game.state = 'home';
          game.overOffTime = 0;
          emit({ type: 'home' });
        }
      }
      // Between steps the body glides on, as it does while crawling, so the slide is smooth.
      worm.interpolation = game.state === 'burrowing' ? burrowTimer / step : 0;
    }

    /** A small warm arrow just ahead of the head, pointing the way home while the burrow is far. */
    function renderBurrowPointer(now) {
      if (!burrow || game.state !== 'playing') return;
      const head = worm.segments[0];
      const cs = GRID.cellSize;
      const hx = (head.x + 0.5 + worm.direction.dx * worm.interpolation) * cs;
      const hy = (head.y + 0.5 + worm.direction.dy * worm.interpolation) * cs;
      const bx = (burrow.x + 0.5) * cs;
      const by = (burrow.y + 0.5) * cs;
      const distance = Math.hypot(bx - hx, by - hy);
      if (distance < cs * 3) return;
      const angle = Math.atan2(by - hy, bx - hx);
      const bob = reducedMotion ? 0 : Math.sin(now * 0.008) * 2;
      ctx.save();
      ctx.translate(hx + Math.cos(angle) * (cs * 0.95 + bob), hy + Math.sin(angle) * (cs * 0.95 + bob));
      ctx.rotate(angle);
      ctx.fillStyle = 'rgba(255, 232, 160, 0.95)';
      ctx.strokeStyle = 'rgba(60, 36, 10, 0.55)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(7, 0);
      ctx.lineTo(-4, -6);
      ctx.lineTo(-1.5, 0);
      ctx.lineTo(-4, 6);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function spawnBurrowBurst(gx, gy) {
      const cx = (gx + 0.5) * GRID.cellSize;
      const cy = (gy + 0.5) * GRID.cellSize;
      const count = reducedMotion ? 0 : 16;
      for (let i = 0; i < count; i++) {
        const a = (i / count) * Math.PI * 2;
        const s = 50 + Math.random() * 60;
        particles.push({
          x: cx, y: cy, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 20,
          life: 600, maxLife: 600,
          color: i % 2 === 0 ? '#8a6a3a' : '#d8c08a',
          size: 1.6 + Math.random(),
        });
      }
      particles.push({ x: cx, y: cy, vx: 0, vy: 0, life: 700, maxLife: 700, ring: true, radius: 5, color: '#f4e2b0' });
    }

    /**
     * The burrow's size and place. Its mouth is wider than the worm's body (0.72 of a cell), so
     * the worm visibly goes into it rather than under it; it opens out over a third of a second.
     */
    function burrowShape(now) {
      const cs = GRID.cellSize;
      const open = Math.min(1, (now - burrow.openedAt) / 350);
      const scale = 0.4 + 0.6 * open;
      return {
        cs,
        cx: (burrow.x + 0.5) * cs,
        cy: (burrow.y + 0.5) * cs,
        rx: cs * 0.64 * scale,
        ry: cs * 0.52 * scale,
      };
    }

    /**
     * The burrow under the worm: while it waits, a warm glow and two rings drifting outwards (it
     * has to be found at a glance in a busy orchard); then a mound of turned soil and the mouth,
     * its far inner wall catching the light and its depth going dark. The worm crawls over the
     * soil and into the mouth.
     */
    function renderBurrowBelow(now) {
      if (!burrow) return;
      const { cs, cx, cy, rx, ry } = burrowShape(now);
      const age = now - burrow.openedAt;
      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      if (game.state === 'playing') {
        const glow = ctx.createRadialGradient(cx, cy, rx * 0.6, cx, cy, cs * 2.2);
        glow.addColorStop(0, 'rgba(255, 226, 140, 0.55)');
        glow.addColorStop(1, 'rgba(255, 226, 140, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(cx, cy, cs * 2.2, 0, Math.PI * 2);
        ctx.fill();
        for (const offset of [0, 0.5]) {
          const pulse = reducedMotion ? 0.35 + offset : ((age / 1600) + offset) % 1;
          ctx.strokeStyle = `rgba(255, 240, 190, ${0.9 * (1 - pulse)})`;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.ellipse(cx, cy, rx + 6 + pulse * cs * 1.3, ry + 6 + pulse * cs * 1.3, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
      // A mound of turned soil round the mouth, crumbs scattered on it.
      const soil = ctx.createRadialGradient(cx, cy, rx * 0.8, cx, cy, rx * 1.6);
      soil.addColorStop(0, '#7a5530');
      soil.addColorStop(0.6, '#94693a');
      soil.addColorStop(1, 'rgba(148, 105, 58, 0)');
      ctx.fillStyle = soil;
      ctx.beginPath();
      ctx.ellipse(cx, cy + ry * 0.1, rx * 1.6, ry * 1.6, 0, 0, Math.PI * 2);
      ctx.fill();
      // Crumbs thrown up by the digging: uneven in place, size and colour (the same every time).
      const CRUMB_COLOURS = ['#5a3d1e', '#6e4b25', '#3f2a14'];
      for (let i = 0; i < 11; i++) {
        const a = i * 0.61 + 0.3 + Math.sin(i * 12.9) * 0.3;
        const reach = 1.12 + ((i * 7) % 5) * 0.08;
        ctx.fillStyle = CRUMB_COLOURS[i % 3];
        ctx.beginPath();
        ctx.arc(cx + Math.cos(a) * rx * reach, cy + Math.sin(a) * ry * reach, cs * (0.028 + ((i * 3) % 4) * 0.009), 0, Math.PI * 2);
        ctx.fill();
      }
      // The mouth: the far inner wall in the light, the rest falling away into the dark.
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
      ctx.clip();
      ctx.fillStyle = '#5b3c1c';
      ctx.fillRect(cx - rx, cy - ry, rx * 2, ry * 2);
      const depth = ctx.createRadialGradient(cx, cy + ry * 0.35, 1, cx, cy + ry * 0.35, rx);
      depth.addColorStop(0, '#030201');
      depth.addColorStop(0.7, '#120b05');
      depth.addColorStop(1, '#2a1a0b');
      ctx.fillStyle = depth;
      ctx.beginPath();
      ctx.ellipse(cx, cy + ry * 0.32, rx * 0.98, ry * 0.92, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      // The rim of the far edge, lit.
      ctx.strokeStyle = 'rgba(255, 222, 170, 0.5)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx, ry, 0, Math.PI * 1.05, Math.PI * 1.95);
      ctx.stroke();
      ctx.restore();
    }

    /**
     * The burrow over the worm, once it is going in: the dark of the hole swallowing whatever has
     * gone past the rim, and the near edge of the hole in front of the body, so it goes down and
     * in rather than under. At home, a pair of eyes looks out of the dark.
     */
    function renderBurrowAbove(now) {
      if (!burrow || (game.state !== 'burrowing' && game.state !== 'home')) return;
      const { cs, cx, cy, rx, ry } = burrowShape(now);
      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
      ctx.clip();
      const dark = ctx.createRadialGradient(cx, cy + ry * 0.25, 1, cx, cy + ry * 0.25, rx * 1.05);
      dark.addColorStop(0, 'rgba(3, 2, 1, 1)');
      dark.addColorStop(0.5, 'rgba(3, 2, 1, 0.94)');
      dark.addColorStop(0.85, 'rgba(10, 6, 3, 0.55)');
      dark.addColorStop(1, 'rgba(20, 12, 5, 0.2)');
      ctx.fillStyle = dark;
      ctx.fillRect(cx - rx, cy - ry, rx * 2, ry * 2);
      ctx.restore();
      // The near edge of the hole: soil in front of the body.
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#7a5530';
      ctx.lineWidth = cs * 0.16;
      // Only the part facing the viewer: a worm going in from the side keeps its body clear.
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx * 1.02, ry * 1.04, 0, Math.PI * 0.2, Math.PI * 0.8);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255, 214, 150, 0.35)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx * 1.1, ry * 1.17, 0, Math.PI * 0.25, Math.PI * 0.75);
      ctx.stroke();
      if (game.state === 'home' && game.overOffTime > 150) renderEyesInTheDark(cx, cy, ry, now);
      ctx.restore();
    }

    /** The worm at home: two eyes in the colours of its look, blinking now and then. */
    function renderEyesInTheDark(cx, cy, ry, now) {
      const fadeIn = Math.min(1, (game.overOffTime - 150) / 300);
      const blink = !reducedMotion && now % 2600 < 140;
      const eyeR = GRID.cellSize * 0.095;
      ctx.globalAlpha = fadeIn;
      for (const side of [-1, 1]) {
        const ex = cx + side * GRID.cellSize * 0.15;
        const ey = cy + ry * 0.05;
        ctx.fillStyle = T.wormEyeWhite;
        ctx.beginPath();
        ctx.ellipse(ex, ey, eyeR, blink ? eyeR * 0.15 : eyeR, 0, 0, Math.PI * 2);
        ctx.fill();
        if (!blink) {
          ctx.fillStyle = T.wormEyeColor === '#000000' ? '#1a1a1a' : T.wormEyeColor;
          ctx.beginPath();
          ctx.arc(ex, ey + eyeR * 0.2, eyeR * 0.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
    }

    // ================= APPLE + PARTICLE UPDATES =================
    function updateApples(dt) {
      if (reducedMotion) return;
      for (const a of apples) {
        a.spin += dt * 0.003;
        a.bob  += dt * 0.0022;
      }
    }

    function spawnFrogEatBurst(gx, gy) {
      const cx = (gx + 0.5) * GRID.cellSize;
      const cy = (gy + 0.5) * GRID.cellSize;
      for (let i = 0; i < 40; i++) {
        const a = (i / 40) * Math.PI * 2 + Math.random() * 0.3;
        const s = 120 + Math.random() * 200;
        particles.push({
          x: cx, y: cy,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s,
          life: 850,
          maxLife: 850,
          color: i % 3 === 0 ? '#ffd044' : (i % 3 === 1 ? '#7cf248' : '#ffffff'),
          size: 2 + Math.random() * 1.6,
        });
      }
      particles.push({
        x: cx, y: cy, vx: 0, vy: 0,
        life: 700, maxLife: 700,
        ring: true, radius: 5,
        color: '#ffd044',
      });
    }

    // ================= PARTICLES =================
    const particles = [];
    function spawnPickupBurst(gx, gy, value) {
      const cx = (gx + 0.5) * GRID.cellSize;
      const cy = (gy + 0.5) * GRID.cellSize;
      const count = 10 + value * 2;                 // bigger apple → more particles
      const bodyColor = appleColorForValue(value);
      for (let i = 0; i < count; i++) {
        const a = (i / count) * Math.PI * 2 + Math.random() * 0.3;
        const s = 60 + Math.random() * 120 + value * 8;
        particles.push({
          x: cx, y: cy,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s,
          life: 550 + value * 30,
          maxLife: 550 + value * 30,
          color: i % 2 === 0 ? bodyColor : T.appleGlow,
          size: 2 + Math.random() * 1.2,
        });
      }
      particles.push({
        x: cx, y: cy, vx: 0, vy: 0,
        life: 400, maxLife: 400,
        ring: true, radius: 4,
        color: bodyColor,
      });
    }
    function spawnDeathBurst(gx, gy) {
      const cx = (gx + 0.5) * GRID.cellSize;
      const cy = (gy + 0.5) * GRID.cellSize;
      for (let i = 0; i < 30; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 90 + Math.random() * 200;
        particles.push({
          x: cx, y: cy,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s,
          life: 900, maxLife: 900,
          color: i % 3 === 0 ? '#ffffff' : (i % 3 === 1 ? T.wormHead : T.wormBody),
          size: 2 + Math.random() * 2,
        });
      }
      particles.push({
        x: cx, y: cy, vx: 0, vy: 0,
        life: 700, maxLife: 700,
        ring: true, radius: 6,
        color: '#ffffff',
      });
    }
    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        const dtSec = dt / 1000;
        if (p.ring) {
          p.radius += 200 * dtSec;
        } else {
          p.x += p.vx * dtSec;
          p.y += p.vy * dtSec;
          p.vx *= Math.pow(0.05, dtSec);
          p.vy *= Math.pow(0.05, dtSec);
        }
      }
    }
    function renderParticles() {
      ctx.save();
      if (T.composite === 'lighter') ctx.globalCompositeOperation = 'lighter';
      for (const p of particles) {
        if (reducedMotion && !p.ring) continue;
        const a = p.life / p.maxLife;
        if (p.ring) {
          ctx.strokeStyle = p.color;
          ctx.globalAlpha = a * 0.8;
          ctx.lineWidth = 3 * a;
          ctx.shadowBlur = 12; ctx.shadowColor = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.stroke();
        } else {
          ctx.fillStyle = p.color;
          ctx.globalAlpha = a;
          ctx.shadowBlur = 10; ctx.shadowColor = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    // ================= AMBIENT DRIFT =================
    const drift = [];
    const stars = [];
    /** Motes and stars scattered over the board (again whenever its size changes). */
    function seedSky() {
      drift.length = 0;
      stars.length = 0;
      for (let i = 0; i < 40; i++) {
        drift.push({
          x: Math.random() * W,
          y: Math.random() * H,
          vx: -6 - Math.random() * 12,
          vy: (Math.random() - 0.5) * 4,
          r: 0.6 + Math.random() * 1.2,
          hueIdx: Math.random() < 0.6 ? 0 : 1,
          phase: Math.random() * Math.PI * 2,
        });
      }
      for (let i = 0; i < 60; i++) {
        stars.push({
          x: Math.random() * W,
          y: Math.random() * H * 0.9,
          r: 0.5 + Math.random() * 1.4,
          phase: Math.random() * Math.PI * 2,
          twinkleSpeed: 0.001 + Math.random() * 0.003,
        });
      }
    }
    seedSky();

    function updateDrift(dt) {
      if (reducedMotion) return;
      const dtSec = dt / 1000;
      for (const d of drift) {
        if (T.risingParticles) {
          d.x += Math.sin(d.phase + clock * 0.001) * 8 * dtSec;
          d.y -= (30 + d.r * 10) * dtSec;
          if (d.y < -10) { d.y = H + 10; d.x = Math.random() * W; }
        } else if (T.sandBlow) {
          d.x += d.vx * 2.2 * dtSec;
          d.y += d.vy * 0.4 * dtSec;
          if (d.x < -10) { d.x = W + 10; d.y = Math.random() * H; }
        } else {
          d.x += d.vx * dtSec;
          d.y += d.vy * dtSec;
          if (d.x < -10) { d.x = W + 10; d.y = Math.random() * H; }
          if (d.y < -10) d.y = H + 10;
          if (d.y > H + 10) d.y = -10;
        }
      }
    }

    // ================= OFFSCREEN STATIC LAYER =================
    let staticLayer = null;
    let staticLayerTheme = null;
    function invalidateStaticLayer() {
      staticLayer = null;
      staticLayerTheme = null;
    }
    function ensureStaticLayer() {
      if (staticLayer && staticLayerTheme === currentTheme) return;
      const scale = boardFit().scale * backing;
      staticLayer = document.createElement('canvas');
      staticLayer.width = Math.round(W * scale);
      staticLayer.height = Math.round(H * scale);
      const sctx = staticLayer.getContext('2d');
      sctx.scale(scale, scale);
      renderStaticLayer(sctx);
      staticLayerTheme = currentTheme;
    }
    function renderStaticLayer(sctx) {
      // Base bg
      if (T.bgGradient) {
        const g = sctx.createLinearGradient(0, 0, 0, H);
        for (const stop of T.bgGradient) g.addColorStop(stop.pos, stop.color);
        sctx.fillStyle = g;
      } else {
        sctx.fillStyle = T.bg;
      }
      sctx.fillRect(0, 0, W, H);

      // Vignette
      const vg = sctx.createRadialGradient(W/2, H/2, 100, W/2, H/2, W*0.7);
      vg.addColorStop(0, T.vignette);
      vg.addColorStop(1, 'rgba(0,0,0,0)');
      sctx.fillStyle = vg;
      sctx.fillRect(0, 0, W, H);

      // Grid lines (aligned with GRID.cellSize)
      sctx.strokeStyle = T.gridLine;
      sctx.lineWidth = 1;
      sctx.beginPath();
      for (let x = GRID.cellSize; x < W; x += GRID.cellSize) {
        sctx.moveTo(x + 0.5, 0);
        sctx.lineTo(x + 0.5, H);
      }
      for (let y = GRID.cellSize; y < H; y += GRID.cellSize) {
        sctx.moveTo(0, y + 0.5);
        sctx.lineTo(W, y + 0.5);
      }
      sctx.stroke();

      // Grid intersection dots
      sctx.save();
      if (T.composite === 'lighter') sctx.globalCompositeOperation = 'lighter';
      sctx.fillStyle = T.gridDot;
      if (T.gridDotGlow > 0) {
        sctx.shadowBlur = T.gridDotGlow;
        sctx.shadowColor = T.gridDot;
      }
      for (let x = GRID.cellSize; x < W; x += GRID.cellSize) {
        for (let y = GRID.cellSize; y < H; y += GRID.cellSize) {
          sctx.beginPath();
          sctx.arc(x, y, 1.2, 0, Math.PI * 2);
          sctx.fill();
        }
      }
      sctx.restore();

      // Wall frame — emphasize the deadly boundary with a strong border
      sctx.save();
      sctx.strokeStyle = T.gridDot;
      sctx.lineWidth = 3;
      if (T.gridDotGlow > 0) {
        sctx.shadowBlur = T.gridDotGlow * 2;
        sctx.shadowColor = T.gridDot;
      }
      sctx.strokeRect(1.5, 1.5, W - 3, H - 3);
      sctx.restore();

      // Moon crescent for Midnight
      if (T.stars) {
        const moonX = W - 80, moonY = 80, moonR = 24;
        const coverX = moonX + 10, coverY = moonY - 4, coverR = 22;
        sctx.save();
        sctx.beginPath();
        sctx.rect(0, 0, W, H);
        sctx.arc(coverX, coverY, coverR, 0, Math.PI * 2, true);
        sctx.clip('evenodd');
        sctx.shadowBlur = 30;
        sctx.shadowColor = 'rgba(240,235,220,0.7)';
        sctx.fillStyle = 'rgba(240,235,220,0.95)';
        sctx.beginPath();
        sctx.arc(moonX, moonY, moonR, 0, Math.PI * 2);
        sctx.fill();
        sctx.restore();
      }
    }

    // ================= APPLE COLOR =================
    function appleColorForValue(v) {
      const t = (v - 1) / 8;   // 0..1
      return lerpColor(T.appleBase, T.appleRipe, t);
    }

    // ================= RENDERING =================
    function renderBackground(time) {
      ensureStaticLayer();
      ctx.drawImage(staticLayer, 0, 0, W, H);

      // Stars
      if (T.stars) {
        ctx.save();
        for (const s of stars) {
          const twinkle = reducedMotion ? 0.8 : 0.4 + 0.6 * Math.abs(Math.sin(time * s.twinkleSpeed + s.phase));
          ctx.fillStyle = `rgba(255,255,220,${twinkle})`;
          ctx.shadowBlur = 4;
          ctx.shadowColor = '#ffeecc';
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r * twinkle, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      // Drift particles
      ctx.save();
      if (T.composite === 'lighter') ctx.globalCompositeOperation = 'lighter';
      for (const d of drift) {
        const pulse = 0.5 + 0.5 * Math.sin(time * 0.002 + d.phase);
        const color = T.driftColors[d.hueIdx].replace('ALPHA', (0.25 * pulse).toFixed(2));
        ctx.fillStyle = color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = color;
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function renderApples(time) {
      for (const a of apples) renderApple(a, time);
    }

    function renderApple(apple, time) {
      const cellSize = GRID.cellSize;
      const cx = (apple.x + 0.5) * cellSize;
      const cy = (apple.y + 0.5) * cellSize;
      const bob = Math.sin(apple.bob) * 2;

      // Size scales with value (0.55 to 1.0 of cellSize/2)
      // Bigger numbers are bigger apples, as in the port; a challenge where the numbers must be
      // read at a glance draws them all large and ripe.
      const sizeFactor = settings.evenApples ? 0.95 : 0.55 + (apple.value / 9) * 0.45;
      const r = (cellSize / 2 - 3) * sizeFactor;

      let bodyColor = appleColorForValue(settings.evenApples ? 8 : apple.value);
      // Rotten visual state: desaturated + darker
      if (apple.state === 'rotten') {
        bodyColor = darkenColor(bodyColor, 0.45);
      }
      const bodyLight = lightenColor(bodyColor, 0.35);
      const bodyDark = darkenColor(bodyColor, 0.35);

      ctx.save();
      ctx.translate(cx, cy + bob);
      const spin = Math.sin(apple.spin);

      // Ground shadow (soft ellipse)
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.20)';
      ctx.filter = 'blur(3px)';
      ctx.beginPath();
      ctx.ellipse(0, r + 4, r * 0.9, r * 0.25, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Apple body with radial gradient
      if (T.composite === 'lighter') ctx.globalCompositeOperation = 'lighter';
      ctx.shadowBlur = 18;
      ctx.shadowColor = T.appleGlow;

      const bodyGrad = ctx.createRadialGradient(-r * 0.3, -r * 0.35, 1, 0, 0, r * 1.4);
      bodyGrad.addColorStop(0, bodyLight);
      bodyGrad.addColorStop(0.55, bodyColor);
      bodyGrad.addColorStop(1, bodyDark);
      ctx.fillStyle = bodyGrad;

      // Proper apple silhouette (stem well + calyx)
      const w = r * 1.02, h = r;
      ctx.beginPath();
      ctx.moveTo(-r * 0.2, -h + 1);
      ctx.quadraticCurveTo(-r * 0.1, -h + 2.5, 0, -h + 1.8);
      ctx.quadraticCurveTo(r * 0.1, -h + 2.5, r * 0.2, -h + 1);
      ctx.bezierCurveTo(r * 0.6, -h + 0.5, w * 0.95, -h * 0.55, w, -h * 0.15);
      ctx.bezierCurveTo(w * 1.05, h * 0.4, w * 0.6, h * 0.95, w * 0.3, h * 0.92);
      ctx.quadraticCurveTo(w * 0.1, h * 1.05, 0, h * 0.90);
      ctx.quadraticCurveTo(-w * 0.1, h * 1.05, -w * 0.3, h * 0.92);
      ctx.bezierCurveTo(-w * 0.6, h * 0.95, -w * 1.05, h * 0.4, -w, -h * 0.15);
      ctx.bezierCurveTo(-w * 0.95, -h * 0.55, -r * 0.6, -h + 0.5, -r * 0.2, -h + 1);
      ctx.closePath();
      ctx.fill();

      // Highlight
      ctx.save();
      ctx.shadowBlur = 0;
      const hlGrad = ctx.createRadialGradient(-r * 0.35 + spin, -r * 0.4, 0, -r * 0.35 + spin, -r * 0.4, r * 0.5);
      hlGrad.addColorStop(0, 'rgba(255,255,255,0.7)');
      hlGrad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = hlGrad;
      ctx.beginPath();
      ctx.ellipse(-r * 0.3 + spin, -r * 0.35, r * 0.25, r * 0.4, -0.35, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Specular dot
      ctx.save();
      ctx.shadowBlur = 4;
      ctx.shadowColor = 'rgba(255,255,255,0.9)';
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.beginPath();
      ctx.arc(-r * 0.35 + spin, -r * 0.5, r * 0.08, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Stem
      ctx.save();
      ctx.strokeStyle = T.appleStem;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, -h + 1);
      ctx.quadraticCurveTo(r * 0.15, -h - 2, r * 0.3, -h - 3);
      ctx.stroke();
      ctx.restore();

      // Leaf
      ctx.save();
      ctx.translate(r * 0.3, -h - 3);
      ctx.rotate(-0.5);
      const leafGrad = ctx.createLinearGradient(0, -0.5, r * 0.5, 0.5);
      leafGrad.addColorStop(0, lightenColor(T.appleLeaf, 0.2));
      leafGrad.addColorStop(1, darkenColor(T.appleLeaf, 0.2));
      ctx.fillStyle = leafGrad;
      ctx.beginPath();
      ctx.moveTo(0, 0.3);
      ctx.quadraticCurveTo(r * 0.25, -r * 0.3, r * 0.55, -r * 0.1);
      ctx.quadraticCurveTo(r * 0.65, 0, r * 0.5, r * 0.1);
      ctx.quadraticCurveTo(r * 0.25, r * 0.2, 0, 0.3);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,40,10,0.4)';
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(r * 0.5, -0.1);
      ctx.stroke();
      ctx.restore();

      // The DIGIT — big centered, with glow
      ctx.save();
      ctx.shadowBlur = 0;
      ctx.globalCompositeOperation = 'source-over';
      const digitSize = r * 1.35;
      ctx.font = `900 ${digitSize}px 'JetBrains Mono', 'Fira Code', monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      // Text shadow for readability
      ctx.fillStyle = T.appleDigitShadow;
      ctx.fillText(String(apple.value), 1, 1);
      ctx.fillStyle = T.appleDigit;
      ctx.fillText(String(apple.value), 0, 0);
      ctx.restore();

      // Rot indicator: subtle dark stipple pattern on top
      if (apple.state === 'rotten') {
        ctx.save();
        ctx.shadowBlur = 0;
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = 'rgba(60,30,10,0.35)';
        for (let i = 0; i < 5; i++) {
          const ang = (i / 5) * Math.PI * 2 + Math.sin(apple.spin) * 0.2;
          const rr = r * 0.55;
          ctx.beginPath();
          ctx.arc(Math.cos(ang) * rr, Math.sin(ang) * rr, r * 0.10, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      ctx.restore();
    }

    // ================= FROG RENDER =================
    function renderFrog(now) {
      if (!frog.active) return;
      const cellSize = GRID.cellSize;

      // Compute position + arc + body transforms per state
      let cx, cy, arc = 0;
      let bodyScaleX = 1, bodyScaleY = 1;
      let legExtend = 0;     // 0 = folded (sitting), 1 = fully extended (mid-jump)
      let headTilt = 0;      // slight tilt during jump for expression
      let facingDx = 0, facingDy = 0;
      const age = now - frog.stateStart;

      switch (frog.state) {
        case 'sitting': {
          cx = (frog.x + 0.5) * cellSize;
          cy = (frog.y + 0.5) * cellSize;
          // Subtle breathing: body scales +/- 3% over ~2s cycle
          const breathe = Math.sin((now - frog.spawnTime) * 0.003);
          bodyScaleY = 1 + breathe * 0.03;
          bodyScaleX = 1 - breathe * 0.02;
          legExtend = 0;
          break;
        }
        case 'crouching': {
          cx = (frog.x + 0.5) * cellSize;
          cy = (frog.y + 0.5) * cellSize;
          // Squish down: gathering power for jump
          const ct = Math.min(1, age / FROG_CROUCH_MS);
          bodyScaleY = 1 - ct * 0.30;
          bodyScaleX = 1 + ct * 0.18;
          legExtend = -ct * 0.3;   // legs fold further
          facingDx = frog.targetX - frog.x;
          facingDy = frog.targetY - frog.y;
          break;
        }
        case 'airborne': {
          const jt = Math.min(1, age / FROG_JUMP_MS);
          cx = ((frog.fromX + 0.5) + (frog.x - frog.fromX) * jt) * cellSize;
          cy = ((frog.fromY + 0.5) + (frog.y - frog.fromY) * jt) * cellSize;
          arc = -Math.sin(jt * Math.PI) * cellSize * FROG_JUMP_HEIGHT_CELLS;
          // Stretch during flight (peak in middle)
          const stretch = Math.sin(jt * Math.PI);
          bodyScaleY = 1 + stretch * 0.22;
          bodyScaleX = 1 - stretch * 0.10;
          legExtend = stretch;            // legs trail back and out
          headTilt = -stretch * 0.15;     // head slightly up mid-jump
          facingDx = frog.x - frog.fromX;
          facingDy = frog.y - frog.fromY;
          break;
        }
        case 'landing': {
          cx = (frog.x + 0.5) * cellSize;
          cy = (frog.y + 0.5) * cellSize;
          // Impact absorb: brief triangular squish peaking mid-landing
          const lt = Math.min(1, age / FROG_LAND_MS);
          const squish = 1 - Math.abs(lt - 0.5) * 2;
          bodyScaleY = 1 - squish * 0.25;
          bodyScaleX = 1 + squish * 0.14;
          legExtend = (1 - lt) * 0.6;   // legs still partly extended, folding back
          break;
        }
      }

      // Spawn/despawn fade
      const totalAge = now - frog.spawnTime;
      const spawnPulse = Math.max(0, 1 - totalAge / 400);
      const despawnT = Math.max(0, (totalAge - (FROG_LIFESPAN_MS - 800)) / 800);
      const fade = 1 - Math.min(1, despawnT);

      // Facing rotation for the frog body (points in direction of last/next jump)
      let facingAngle = 0;
      if (facingDx !== 0 || facingDy !== 0) {
        facingAngle = Math.atan2(facingDy, facingDx) + Math.PI / 2;   // frog faces "north" by default
      }

      // ---- Ground shadow (stays on ground plane, not on frog) ----
      ctx.save();
      ctx.globalAlpha = fade;
      const heightRatio = Math.abs(arc) / (cellSize * FROG_JUMP_HEIGHT_CELLS + 0.01);
      const sScale = 1 - heightRatio * 0.45;
      const sAlpha = 0.30 - heightRatio * 0.18;
      ctx.fillStyle = `rgba(0,0,0,${Math.max(0.05, sAlpha)})`;
      ctx.filter = 'blur(4px)';
      const cellSize2 = cellSize;
      ctx.beginPath();
      ctx.ellipse(cx, cy + cellSize2 * 0.30, cellSize2 * 0.36 * sScale, cellSize2 * 0.11 * sScale, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // ---- Frog body (at cx, cy + arc, with facing rotation and scale) ----
      ctx.save();
      ctx.globalAlpha = fade * (1 + spawnPulse * 0.4);
      ctx.translate(cx, cy + arc);
      ctx.rotate(facingAngle);
      ctx.scale(bodyScaleX, bodyScaleY);

      drawFrogBody(cellSize * 0.36, legExtend, headTilt);
      ctx.restore();
    }

    function drawFrogBody(r, legExtend, headTilt) {
      // r = base radius; legExtend = 0 (folded) to 1 (fully extended, jump peak)
      // Top-down view: head at top (-y direction in local frame after rotation).

      // --- HIND LEGS (drawn first, behind body) ---
      // Sitting: legs folded in "M" shape at sides
      // Extended: legs kick back and outward
      const legBaseX = r * 0.55;
      const legBaseY = r * 0.10;
      const kneeX = r * (0.85 + legExtend * 0.20);
      const kneeY = r * (0.05 - legExtend * 0.15);
      const footX = r * (0.55 + legExtend * 0.55);
      const footY = r * (0.55 + legExtend * 0.30);

      ctx.fillStyle = '#2a6a2a';
      ctx.shadowBlur = 6;
      ctx.shadowColor = '#1e5a20';

      // Left hind leg
      ctx.beginPath();
      ctx.moveTo(-legBaseX, legBaseY);
      ctx.quadraticCurveTo(-kneeX, kneeY, -footX, footY);
      ctx.quadraticCurveTo(-footX * 0.9, footY + r * 0.18, -footX * 0.6, footY + r * 0.14);
      ctx.quadraticCurveTo(-r * 0.45, legBaseY + r * 0.25, -legBaseX, legBaseY);
      ctx.closePath();
      ctx.fill();
      // Webbed foot toes (3 small circles at foot end)
      ctx.fillStyle = '#4a8a3a';
      ctx.shadowBlur = 0;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.arc(-footX - r * 0.06, footY + i * r * 0.10, r * 0.08, 0, Math.PI * 2);
        ctx.fill();
      }

      // Right hind leg (mirror)
      ctx.fillStyle = '#2a6a2a';
      ctx.shadowBlur = 6;
      ctx.shadowColor = '#1e5a20';
      ctx.beginPath();
      ctx.moveTo(legBaseX, legBaseY);
      ctx.quadraticCurveTo(kneeX, kneeY, footX, footY);
      ctx.quadraticCurveTo(footX * 0.9, footY + r * 0.18, footX * 0.6, footY + r * 0.14);
      ctx.quadraticCurveTo(r * 0.45, legBaseY + r * 0.25, legBaseX, legBaseY);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#4a8a3a';
      ctx.shadowBlur = 0;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.arc(footX + r * 0.06, footY + i * r * 0.10, r * 0.08, 0, Math.PI * 2);
        ctx.fill();
      }

      // --- BODY (squat oval, wider at back) ---
      ctx.shadowBlur = 8;
      ctx.shadowColor = 'rgba(30,80,30,0.5)';
      const bodyGrad = ctx.createRadialGradient(-r * 0.2, -r * 0.3, 1, 0, 0, r * 1.15);
      bodyGrad.addColorStop(0, '#98e068');
      bodyGrad.addColorStop(0.55, '#4ec24a');
      bodyGrad.addColorStop(1, '#1e6a28');
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      // Squat oval — slightly wider at back (positive y) than front (head area)
      ctx.ellipse(0, r * 0.05, r * 0.85, r * 0.72, 0, 0, Math.PI * 2);
      ctx.fill();

      // Dorsal stripe (subtle darker mid-line)
      ctx.strokeStyle = 'rgba(20,60,20,0.5)';
      ctx.lineWidth = 1;
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.moveTo(0, -r * 0.5);
      ctx.lineTo(0, r * 0.6);
      ctx.stroke();

      // Back spots (few dark stipples for texture)
      ctx.fillStyle = 'rgba(20,60,20,0.55)';
      const spots = [
        [-r*0.35, -r*0.15, r*0.10],
        [r*0.30, -r*0.05, r*0.08],
        [r*0.40,  r*0.30, r*0.09],
        [-r*0.30, r*0.35, r*0.10],
        [r*0.05,  r*0.20, r*0.07],
        [-r*0.10, -r*0.05, r*0.06],
      ];
      for (const [sx, sy, sr] of spots) {
        ctx.beginPath();
        ctx.arc(sx, sy, sr, 0, Math.PI * 2);
        ctx.fill();
      }

      // --- FRONT LEGS (small paws visible at front-sides) ---
      ctx.fillStyle = '#4ec24a';
      ctx.shadowBlur = 4;
      ctx.shadowColor = 'rgba(30,80,30,0.4)';
      ctx.beginPath();
      ctx.ellipse(-r * 0.42, -r * 0.30, r * 0.14, r * 0.10, -0.3, 0, Math.PI * 2);
      ctx.ellipse( r * 0.42, -r * 0.30, r * 0.14, r * 0.10,  0.3, 0, Math.PI * 2);
      ctx.fill();

      // --- HEAD BASE (slight darker mound where eyes will sit) ---
      ctx.fillStyle = '#3a8a3a';
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(-r * 0.30, -r * 0.55 + headTilt * r * 0.1, r * 0.22, 0, Math.PI * 2);
      ctx.arc( r * 0.30, -r * 0.55 + headTilt * r * 0.1, r * 0.22, 0, Math.PI * 2);
      ctx.fill();

      // --- EYES (bulging orbs on top of head) ---
      const eyeY = -r * 0.62 + headTilt * r * 0.1;
      // Outer green orb
      ctx.fillStyle = '#78d848';
      ctx.shadowBlur = 4;
      ctx.shadowColor = 'rgba(120,216,72,0.5)';
      ctx.beginPath();
      ctx.arc(-r * 0.30, eyeY, r * 0.19, 0, Math.PI * 2);
      ctx.arc( r * 0.30, eyeY, r * 0.19, 0, Math.PI * 2);
      ctx.fill();

      // Iris — golden yellow
      ctx.fillStyle = '#f2c840';
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(-r * 0.30, eyeY, r * 0.13, 0, Math.PI * 2);
      ctx.arc( r * 0.30, eyeY, r * 0.13, 0, Math.PI * 2);
      ctx.fill();

      // Vertical slit pupils (frog signature)
      ctx.fillStyle = '#000';
      ctx.fillRect(-r * 0.32, eyeY - r * 0.09, r * 0.04, r * 0.18);
      ctx.fillRect( r * 0.28, eyeY - r * 0.09, r * 0.04, r * 0.18);

      // Eye highlights (small white glints for life)
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath();
      ctx.arc(-r * 0.26, eyeY - r * 0.10, r * 0.04, 0, Math.PI * 2);
      ctx.arc( r * 0.34, eyeY - r * 0.10, r * 0.04, 0, Math.PI * 2);
      ctx.fill();

      // --- NOSTRILS (small dots below eyes, on front of head) ---
      ctx.fillStyle = 'rgba(20,50,20,0.7)';
      ctx.beginPath();
      ctx.arc(-r * 0.10, -r * 0.42 + headTilt * r * 0.1, r * 0.035, 0, Math.PI * 2);
      ctx.arc( r * 0.10, -r * 0.42 + headTilt * r * 0.1, r * 0.035, 0, Math.PI * 2);
      ctx.fill();

      // --- MOUTH (wide curved line across face) ---
      ctx.strokeStyle = 'rgba(20,50,20,0.8)';
      ctx.lineWidth = 1.3;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-r * 0.45, -r * 0.28 + headTilt * r * 0.1);
      ctx.quadraticCurveTo(0, -r * 0.14 + headTilt * r * 0.1, r * 0.45, -r * 0.28 + headTilt * r * 0.1);
      ctx.stroke();
    }

    function renderWorm(time) {
      const cellSize = GRID.cellSize;
      const bodyWidth = cellSize * 0.72;
      const t = worm.interpolation;
      const N = worm.segments.length;
      if (N === 0) return;

      // Build points array: interpolated head first, then all body cells,
      // with tail retracted if not growing this tick.
      const points = [];

      // Head with forward interpolation
      const head = worm.segments[0];
      // In the burrow the head goes no further: only the body behind it glides on.
      const headT = game.state === 'burrowing' ? 0 : t;
      const headX = (head.x + 0.5 + worm.direction.dx * headT) * cellSize;
      const headY = (head.y + 0.5 + worm.direction.dy * headT) * cellSize;
      points.push({x: headX, y: headY, isHead: true});

      // All body segments (cell centers)
      for (let i = 0; i < N; i++) {
        const s = worm.segments[i];
        points.push({x: (s.x + 0.5) * cellSize, y: (s.y + 0.5) * cellSize});
      }

      // Tail retraction: if we're not growing, the tail moves toward the segment
      // in front of it during the tick. Interpolate.
      if (worm.growing === 0 && N > 1) {
        const tail = worm.segments[N - 1];
        const before = worm.segments[N - 2];
        const tdx = before.x - tail.x;
        const tdy = before.y - tail.y;
        // Replace last point with interpolated position
        points[points.length - 1] = {
          x: (tail.x + 0.5 + tdx * t) * cellSize,
          y: (tail.y + 0.5 + tdy * t) * cellSize,
        };
      }

      // ---- Single-pass glow (whole body one stroke) ----
      ctx.save();
      if (T.composite === 'lighter') ctx.globalCompositeOperation = 'lighter';
      ctx.shadowBlur = T.wormGlowRadius;
      ctx.shadowColor = T.wormGlow;
      ctx.strokeStyle = T.wormBody;
      ctx.lineWidth = bodyWidth;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      for (let i = 0; i < points.length; i++) {
        if (i === 0) ctx.moveTo(points[i].x, points[i].y);
        else ctx.lineTo(points[i].x, points[i].y);
      }
      ctx.stroke();
      ctx.restore();

      // ---- Body fill with head-to-tail gradient (no shadow, cheap) ----
      // Draw with slightly smaller width so glow remains visible around edges.
      ctx.save();
      if (T.composite === 'lighter') ctx.globalCompositeOperation = 'lighter';
      // Multi-segment gradient stroke: use a linear gradient along the bounding box
      // of the path. Approximation but reads correctly for typical worm shapes.
      const bbox = getBBox(points);
      const grad = ctx.createLinearGradient(points[0].x, points[0].y,
        points[points.length-1].x, points[points.length-1].y);
      grad.addColorStop(0, T.wormHead);
      grad.addColorStop(1, T.wormBody);
      ctx.strokeStyle = grad;
      ctx.lineWidth = bodyWidth - 4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      for (let i = 0; i < points.length; i++) {
        if (i === 0) ctx.moveTo(points[i].x, points[i].y);
        else ctx.lineTo(points[i].x, points[i].y);
      }
      ctx.stroke();
      ctx.restore();

      // ---- Muscle pulse (subtle brightness ripple down body) ----
      ctx.save();
      if (T.composite === 'lighter') ctx.globalCompositeOperation = 'lighter';
      for (let i = 1; i < points.length; i++) {
        const p = points[i];
        const pulse = 0.5 + 0.5 * Math.sin(time * 0.006 + i * 0.45);
        ctx.fillStyle = `rgba(255,255,255,${pulse * 0.10})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, (bodyWidth - 4) * 0.35, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // ---- Head details: eyes + tongue ----
      const headPoint = points[0];
      const dir = worm.direction;
      ctx.save();
      ctx.translate(headPoint.x, headPoint.y);
      ctx.rotate(Math.atan2(dir.dy, dir.dx));

      const eyeR = bodyWidth * 0.14;
      // Eye whites
      ctx.fillStyle = T.wormEyeWhite;
      ctx.beginPath();
      ctx.arc(bodyWidth * 0.10, -bodyWidth * 0.22, eyeR, 0, Math.PI * 2);
      ctx.arc(bodyWidth * 0.10,  bodyWidth * 0.22, eyeR, 0, Math.PI * 2);
      ctx.fill();
      // Pupils
      ctx.fillStyle = T.wormEyeColor;
      ctx.beginPath();
      ctx.arc(bodyWidth * 0.13, -bodyWidth * 0.22, eyeR * 0.55, 0, Math.PI * 2);
      ctx.arc(bodyWidth * 0.13,  bodyWidth * 0.22, eyeR * 0.55, 0, Math.PI * 2);
      ctx.fill();
      // Slit if eye color is bright
      if (T.wormEyeColor !== '#000000') {
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 0.6;
        ctx.beginPath();
        ctx.moveTo(bodyWidth * 0.13, -bodyWidth * 0.30);
        ctx.lineTo(bodyWidth * 0.13, -bodyWidth * 0.14);
        ctx.moveTo(bodyWidth * 0.13,  bodyWidth * 0.14);
        ctx.lineTo(bodyWidth * 0.13,  bodyWidth * 0.30);
        ctx.stroke();
      }

      // Tongue flick (occasional)
      const flick = reducedMotion ? 0 : Math.sin(time * 0.0032);
      if (flick > 0.7) {
        const extend = (flick - 0.7) / 0.3;
        ctx.strokeStyle = '#ff2266';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(bodyWidth * 0.45, 0);
        ctx.lineTo(bodyWidth * 0.55 + extend * 6, -1.5);
        ctx.moveTo(bodyWidth * 0.45, 0);
        ctx.lineTo(bodyWidth * 0.55 + extend * 6,  1.5);
        ctx.stroke();
      }

      ctx.restore();
    }

    function getBBox(points) {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const p of points) {
        if (p.x < minX) minX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.x > maxX) maxX = p.x;
        if (p.y > maxY) maxY = p.y;
      }
      return { minX, minY, maxX, maxY };
    }

    // ================= COLOR UTILS =================
    // parseColor handles both '#rrggbb' AND 'rgb(r,g,b)' formats,
    // so lightenColor/darkenColor can safely take lerpColor's output.
    function parseColor(str) {
      if (str.startsWith('#')) {
        return [
          parseInt(str.slice(1,3),16),
          parseInt(str.slice(3,5),16),
          parseInt(str.slice(5,7),16),
        ];
      }
      const m = str.match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
      if (m) return [parseInt(m[1],10), parseInt(m[2],10), parseInt(m[3],10)];
      return [128, 128, 128];
    }
    function toRgb(r, g, b) {
      return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
    }
    function lerpColor(c1, c2, t) {
      const [r1,g1,b1] = parseColor(c1);
      const [r2,g2,b2] = parseColor(c2);
      return toRgb(r1+(r2-r1)*t, g1+(g2-g1)*t, b1+(b2-b1)*t);
    }
    function lightenColor(color, factor) {
      const [r, g, b] = parseColor(color);
      return toRgb(r + (255-r)*factor, g + (255-g)*factor, b + (255-b)*factor);
    }
    function darkenColor(color, factor) {
      const [r, g, b] = parseColor(color);
      return toRgb(r*(1-factor), g*(1-factor), b*(1-factor));
    }

    // ================= WHEN THE CREATURES COME (added in the collection) =================
    // The port's timings, as its constants above set them. The season's crawls last a minute or
    // so, much shorter than a crawl in the port, so its orchards bring their creatures in sooner
    // (src/orchards.mjs); the free orchard keeps these.
    const PORT_TIMING = {
      ripeMs: APPLE_RIPE_MS,
      hatchMs: WASP_ROT_TO_SPAWN_MS,
      waspLives: WASP_LIFESPAN_MS,
      frogFirst: [FROG_SPAWN_MIN_MS, FROG_SPAWN_MAX_MS],
      frogEvery: [FROG_SPAWN_MIN_MS, FROG_SPAWN_MAX_MS],
      birdFirst: [BIRD_SPAWN_MIN_MS, BIRD_SPAWN_MAX_MS],
      birdEvery: [BIRD_SPAWN_MIN_MS, BIRD_SPAWN_MAX_MS],
      rivalFirst: [RIVAL_INITIAL_SPAWN_MIN, RIVAL_INITIAL_SPAWN_MAX],
      rivalEvery: [RIVAL_RESPAWN_MIN_MS, RIVAL_RESPAWN_MAX_MS],
      gardenerFirst: [GARDENER_SPAWN_MIN_MS, GARDENER_SPAWN_MAX_MS],
      gardenerEvery: [GARDENER_SPAWN_MIN_MS, GARDENER_SPAWN_MAX_MS],
      gardenerStays: GARDENER_LIFESPAN_MS,
    };
    let timing = { ...PORT_TIMING };

    // ================= THE ORCHARD BEHIND THE DESK =================
    // While the desk is open a worm crawls the orchard on its own, the way an attract mode would:
    // it heads for the nearest apple it can reach and keeps clear of its own tail. Nothing it
    // does is told to the desk, and when it does come to grief it simply starts again.
    let demo = false;
    const DIRS = [{ dx: 1, dy: 0 }, { dx: 0, dy: 1 }, { dx: -1, dy: 0 }, { dx: 0, dy: -1 }];

    function startDemo() {
      Object.assign(settings, PORT_SETTINGS, { mode: 'wild', speed: 'classic' });
      // A frog soon, so the orchard behind the desk has some life in it.
      timing = { ...PORT_TIMING, frogFirst: [3000, 6000], frogEvery: [12000, 18000] };
      draw = { value: Math.random, place: Math.random, creature: Math.random };
      demo = true;
      restartGame();
    }

    /** Open cells reachable from `start` (walls, fences and the worm's body block the way). */
    function reachableFrom(start, blocked) {
      const seen = new Set([start.x + ',' + start.y]);
      const queue = [start];
      while (queue.length) {
        const c = queue.shift();
        for (const d of DIRS) {
          const nx = c.x + d.dx, ny = c.y + d.dy, key = nx + ',' + ny;
          if (nx < 0 || ny < 0 || nx >= GRID.cols || ny >= GRID.rows || seen.has(key) || blocked.has(key)) continue;
          seen.add(key);
          queue.push({ x: nx, y: ny });
        }
      }
      return seen.size;
    }

    // A turn queued now applies from the cell after the next move (the port's turn accuracy), so
    // the demo plans from there, or from the head when straight on is a wall (the input rescue).
    function steerDemo() {
      const head = worm.segments[0];
      const blocked = new Set(worm.segments.slice(0, -1).map((c) => c.x + ',' + c.y));
      for (const f of fences) blocked.add(f.x + ',' + f.y);
      const outside = (c) => c.x < 0 || c.y < 0 || c.x >= GRID.cols || c.y >= GRID.rows;
      const ahead = { x: head.x + worm.direction.dx, y: head.y + worm.direction.dy };
      const origin = outside(ahead) || blocked.has(ahead.x + ',' + ahead.y) ? head : ahead;
      if (origin === ahead) blocked.add(head.x + ',' + head.y);
      const target = apples.reduce((best, a) => {
        const d = Math.abs(a.x - origin.x) + Math.abs(a.y - origin.y);
        return !best || d < best.d ? { a, d } : best;
      }, null);
      let choice = null;
      for (const d of DIRS) {
        if (d.dx === -worm.direction.dx && d.dy === -worm.direction.dy) continue;
        const next = { x: origin.x + d.dx, y: origin.y + d.dy };
        const key = next.x + ',' + next.y;
        if (next.x < 0 || next.y < 0 || next.x >= GRID.cols || next.y >= GRID.rows || blocked.has(key)) continue;
        // Room to live in matters more than the apple: never turn into a pocket smaller than the worm.
        const room = Math.min(reachableFrom(next, blocked), worm.segments.length + 2);
        const distance = target ? Math.abs(target.a.x - next.x) + Math.abs(target.a.y - next.y) : 0;
        const score = room * 100 - distance;
        if (!choice || score > choice.score) choice = { d, score };
      }
      if (choice) worm.directionQueue = [choice.d];
    }

    // ================= MAIN LOOP =================
    /** One step of the orchard: every creature, the apples and the worm, but no drawing. */
    function stepWorld(dt) {
      clock += dt;
      const now = clock;

      if (game.state !== 'playing') game.overOffTime += dt;

      updateApples(dt);
      updateApplesLifecycle(now);      // Wild mode rot + delayed respawn
      updateFrog(now);                  // Wild mode frog bonus
      updateBird(dt, now);              // Wild mode enemy: Bird (Phase 1)
      updateWasps(dt, now);             // Wild mode enemy: Wasps (Phase 2)
      updateGardener(dt, now);          // Wild mode enemy: Gardener (Phase 4)
      updateRivalSpawn(now);            // Wild mode enemy: Rival worm (Phase 3)
      updateParticles(dt);

      if (game.state === 'playing') {
        worm.tickTimer += dt;
        worm.interpolation = Math.min(1, worm.tickTimer / worm.tickInterval);
        while (worm.tickTimer >= worm.tickInterval && game.state === 'playing') {
          worm.tickTimer -= worm.tickInterval;
          worm.interpolation = 0;
          if (demo) steerDemo();
          doTick();
        }
      } else if (game.state === 'burrowing') {
        stepBurrowing(dt);
      }
      if (demo && game.state !== 'playing' && game.overOffTime > 900) startDemo();
    }

    function renderWorld(now) {
      ctx.setTransform(backing, 0, 0, backing, 0, 0);
      const fit = boardFit();
      const framed = fit.x > 0.5 || fit.y > 0.5;
      if (framed) renderHedge(fit);
      ctx.save();
      ctx.translate(fit.x, fit.y);
      ctx.scale(fit.scale, fit.scale);
      if (framed) {
        ctx.beginPath();
        ctx.rect(0, 0, W, H);
        ctx.clip();
      }
      renderBackground(now);
      renderFences();
      renderApples(now);
      renderFrog(now);
      renderBird(now);
      renderWasps(now);
      renderGardener(now);
      renderRival(now);
      renderBurrowBelow(now);

      if (game.state === 'dead') {
        // Fade worm during death
        const t = Math.min(1, game.overOffTime / 400);
        ctx.save();
        ctx.globalAlpha = 1 - t;
        renderWorm(now);
        ctx.restore();
      } else if (game.state !== 'home') {
        renderWorm(now);
      }

      renderBurrowAbove(now);
      renderBurrowPointer(now);
      renderParticles();
      ctx.restore();
    }

    let lastTime = performance.now();
    function loop(time) {
      // Paused (the Hall's menu, a hidden tab, the game's own pause), the orchard holds still and
      // its clock waits.
      const dt = paused ? 0 : Math.min(50, time - lastTime);
      lastTime = time;

      updateDrift(dt);
      stepWorld(dt);
      renderWorld(clock);
      emit({ type: 'frame', canvas });

      requestAnimationFrame(loop);
    }

    // ================= INIT =================
    fitBacking();
    if (window.ResizeObserver) new ResizeObserver(fitBacking).observe(canvas);
    else window.addEventListener('resize', fitBacking);
    startDemo();
    updateScoreDisplay();
    updateLengthDisplay();
    requestAnimationFrame(loop);

    // ================= THE DESK'S HANDLE =================
    /** Sets `patch` on `target` while `draw` runs, then puts everything back. */
    function borrowing(target, patch, run) {
      const saved = {};
      for (const key of Object.keys(patch)) saved[key] = target[key];
      Object.assign(target, patch);
      try { run(); } finally { Object.assign(target, saved); }
    }

    /** The almanac's pictures: one of the orchard's own drawings, centred in a 160×120 frame. */
    function drawPortrait(kind, now) {
      const centre = (cells, zoom) => {
        ctx.translate(80, 60);
        ctx.scale(zoom, zoom);
        ctx.translate(-cells.x * GRID.cellSize, -cells.y * GRID.cellSize);
      };
      if (kind === 'apple' || kind === 'rotten') {
        centre({ x: 0.5, y: 0.5 }, 2.4);
        renderApple({ x: 0, y: 0, value: kind === 'apple' ? 7 : 4, spin: 0.6, bob: 0, state: kind === 'apple' ? 'ripe' : 'rotten' }, now);
      } else if (kind === 'frog') {
        ctx.translate(80, 64);
        ctx.scale(2.6, 2.6);
        drawFrogBody(GRID.cellSize * 0.36, 0, 0);
      } else if (kind === 'wasp') {
        ctx.translate(80, 60);
        ctx.scale(4, 4);
        renderWasp({ x: 0, y: 0, vx: 1, vy: -0.6, state: 'chasing', stateStart: now - 1000, wingPhase: 0.3, hoverPhase: 0 }, now);
      } else if (kind === 'bird') {
        ctx.translate(80, 52);
        ctx.scale(2.6, 2.6);
        borrowing(bird, { active: true, x: 0, y: 0, vx: 1, vy: -0.25, altitude: 0.75, wingPhase: 0.12 }, () => renderBird(now));
      } else if (kind === 'gardener') {
        centre({ x: 0.5, y: 0.5 }, 2.6);
        borrowing(gardener, { active: true, x: 0, y: 0, prevX: 0, prevY: 0, stepStart: now - 1e6, state: 'stalking', stateStart: now - 1e6, armPhase: 0.2 }, () => renderGardener(now));
      } else if (kind === 'rival') {
        centre({ x: 2.5, y: 1.5 }, 0.95);
        const segments = [{ x: 4, y: 1 }, { x: 3, y: 1 }, { x: 2, y: 1 }, { x: 2, y: 2 }, { x: 1, y: 2 }, { x: 0, y: 2 }, { x: 0, y: 1 }];
        borrowing(rival, { active: true, segments, direction: { dx: 1, dy: 0 } }, () =>
          borrowing(worm, { interpolation: 0 }, () => renderRival(now)));
      } else if (kind === 'worm') {
        centre({ x: 2.5, y: 1.5 }, 0.95);
        const segments = [{ x: 4, y: 2 }, { x: 3, y: 2 }, { x: 2, y: 2 }, { x: 2, y: 1 }, { x: 1, y: 1 }, { x: 0, y: 1 }, { x: 0, y: 2 }];
        borrowing(worm, { segments, direction: { dx: 1, dy: 0 }, interpolation: 0, growing: 1 }, () => renderWorm(now));
      } else if (kind === 'burrow') {
        centre({ x: 0.5, y: 0.5 }, 2.6);
        const wasState = game.state;
        game.state = 'home';
        burrowingPortrait(now);
        game.state = wasState;
      }
    }

    function burrowingPortrait(now) {
      const saved = burrow;
      burrow = { x: 0, y: 0, openedAt: now - 1000 };
      try {
        renderBurrowBelow(now);
        borrowing(game, { overOffTime: 1000 }, () => renderBurrowAbove(now));
      } finally { burrow = saved; }
    }

    window.OrchardGame = {
      themes: Object.fromEntries(Object.entries(THEMES).map(([key, t]) => [key, { name: t.name, swatch: t.swatch }])),
      fences: Object.keys(FENCE_LAYOUTS),
      on(listen) { listeners.push(listen); },
      /** The desk is open: an orchard's look behind it, with a worm crawling on its own. */
      showMenu(theme) {
        setTheme(theme);
        startDemo();
      },
      /**
       * A crawl: the look, the rules (`settings` as the port knew them, plus the harvest that
       * opens the burrow and the way to place it), the three draw streams (seeded for the Daily
       * Orchard) and the best the line under the field shows.
       */
      begin({ theme, rules, streams, best = 0 }) {
        setTheme(theme);
        const { timing: sooner, ...portRules } = rules;
        Object.assign(settings, PORT_SETTINGS, portRules);
        timing = { ...PORT_TIMING, ...sooner };
        draw = streams || { value: Math.random, place: Math.random, creature: Math.random };
        demo = false;
        game.bestScore = best;
        restartGame();
        emit({ type: 'start' });
      },
      /** Leaves a crawl unfinished (the pause menu's way out): nothing is told to anyone. */
      abandon(theme) {
        this.showMenu(theme || currentTheme);
      },
      setPaused(value) { paused = value; },
      setReducedMotion(value) { reducedMotion = value; },
      setSteadyPace(value) { steadyPace = value; updateTickInterval(); },
      get state() { return demo ? 'menu' : game.state; },
      get score() { return game.score; },
      get paused() { return paused; },
      /** What is in the orchard, for the browser tests and the balance bot. */
      peek() {
        const head = worm.segments[0];
        return {
          state: demo ? 'menu' : game.state, clock, score: game.score, harvested: game.harvested,
          bestBite: game.bestBite, growing: worm.growing, length: worm.segments.length,
          head: { ...head }, heading: { ...worm.direction },
          segments: worm.segments.map((c) => ({ x: c.x, y: c.y })),
          apples: apples.map((a) => ({ x: a.x, y: a.y, value: a.value, rotten: a.state === 'rotten' })),
          burrow: burrow ? { x: burrow.x, y: burrow.y } : null,
          frog: frog.active ? { x: frog.x, y: frog.y } : null,
          bird: bird.active ? { state: bird.state, x: bird.x, y: bird.y } : null,
          wasps: wasps.map((w) => ({ x: w.x / GRID.cellSize - 0.5, y: w.y / GRID.cellSize - 0.5 })),
          rival: rival.active ? { segments: rival.segments.map((c) => ({ x: c.x, y: c.y })) } : null,
          gardener: gardener.active ? { x: gardener.x, y: gardener.y, state: gardener.state } : null,
          fences: fences.map((c) => ({ x: c.x, y: c.y })),
          cols: GRID.cols, rows: GRID.rows, tickMs: worm.tickInterval,
          freeCells: freeCells(), straightRun, maxStraight: settings.maxStraight, turns: settings.turns,
        };
      },
      /** Turns the worm as a key press would (no turning straight back, two turns queued at most). */
      steer(dx, dy) {
        const last = worm.directionQueue.length ? worm.directionQueue[worm.directionQueue.length - 1] : worm.direction;
        if ((dx === -last.dx && dy === -last.dy) || (dx === last.dx && dy === last.dy)) return;
        if (!turnAllowed(last, dx, dy)) return;
        if (worm.directionQueue.length < 2) worm.directionQueue.push({ dx, dy });
      },
      /** A challenge met (the desk's judgement): the crawl ends there, in success. */
      succeed(reason) {
        if (game.state !== 'playing') return;
        game.state = 'won';
        game.overOffTime = 0;
        emit({ type: 'success', reason });
      },
      /** A challenge's rule broken (the desk's judgement): the crawl ends as a crash would. */
      fail(reason) {
        triggerDeath(reason);
      },
      /** For the browser tests: an apple of `value` at a cell, as if it had grown there. */
      plant(x, y, value) {
        const at = apples.findIndex((a) => a.x === x && a.y === y);
        if (at >= 0) apples.splice(at, 1);
        apples.push({ x, y, value, spin: 0, bob: 0, spawnTime: clock, state: 'ripe' });
      },
      /**
       * For the balance check and the browser tests: plays on without drawing, `stepMs` at a
       * time, asking `steer(peek)` for a direction ({ dx, dy }, or nothing to keep on) before
       * every step, until the crawl ends, `until(peek)` holds or `limitMs` has passed. Returns
       * the state and the time played.
       */
      fastForward(limitMs, steer, stepMs = 16, until = null) {
        let t = 0;
        const going = () => game.state === 'playing' || game.state === 'burrowing';
        for (; t < limitMs && going() && !(until && until(this.peek())); t += stepMs) {
          const want = steer && game.state === 'playing' ? steer(this.peek()) : null;
          if (want) { worm.directionQueue = [want]; }
          stepWorld(stepMs);
        }
        return { state: game.state, ms: t };
      },
      /** Draws one of the orchard's creatures into a canvas for the almanac. */
      portrait(kind, target, theme) {
        const outer = { ctx, T };
        const scale = target.width / 160;
        ctx = target.getContext('2d');
        if (theme && THEMES[theme]) T = THEMES[theme];
        ctx.setTransform(scale, 0, 0, scale, 0, 0);
        ctx.clearRect(0, 0, 160, 120);
        ctx.save();
        try { drawPortrait(kind, clock); } finally {
          ctx.restore();
          ctx = outer.ctx;
          T = outer.T;
        }
      },
    };
    window.loadingAt?.(0.6);
    document.dispatchEvent(new Event('orchard-ready'));
  })();
  </script>
  <script type="module" src="src/desk.mjs"></script>
